  /* ================= fillistan =================
     Visar en fil om den är ändrad, egenskapad, eller den du står i.
     Ett orört kapitel du bara tittat på skräpar alltså inte ner, men
     den aktiva filen saknas aldrig i listan. */
  var fillistan = document.getElementById("fillista");
  var visaAllaFiler = false;
  var kapitelfilerOppna = false;

  function synligaFiler() {
    return Object.keys(arbetsyta).filter(function (n) {
      var f = arbetsyta[n];
      return visaAllaFiler || f.egen || f.andrad || n === aktivFil;
    }).sort();
  }

  function ritaFiler() {
    fillistan.textContent = "";
    var namnen = synligaFiler();
    var har = nuvarandeVarld();
    var egna = namnen.filter(function (n) { return varldFor(arbetsyta[n]) === har; });
    var andra = namnen.filter(function (n) { return varldFor(arbetsyta[n]) !== har; });

    if (!egna.length && !andra.length) {
      var tom = document.createElement("p");
      tom.className = "tomlista";
      tom.textContent = SPRAK.ui.inga_filer;
      fillistan.appendChild(tom);
    }
    egna.forEach(function (namn) { fillistan.appendChild(filrad(namn)); });

    // Kapitelfilerna ligger hopfällda i utvecklarläget — de hör till
    // kursen och ska inte skräpa, men de finns kvar och går att öppna.
    if (andra.length) {
      var yta = document.createElement("details");
      yta.className = "kapitelfiler";
      yta.open = kapitelfilerOppna;
      yta.addEventListener("toggle", function () { kapitelfilerOppna = yta.open; });
      var rubrik = document.createElement("summary");
      rubrik.textContent = (devlage ? SPRAK.ui.kapitelfiler : SPRAK.ui.devfiler)
        .replace("{antal}", andra.length);
      yta.appendChild(rubrik);
      andra.forEach(function (namn) { yta.appendChild(filrad(namn)); });
      fillistan.appendChild(yta);
    }

    var totalt = Object.keys(arbetsyta).length;
    if (totalt > namnen.length || visaAllaFiler) {
      var mer = document.createElement("button");
      mer.className = "visa-alla";
      mer.textContent = visaAllaFiler
        ? SPRAK.ui.visa_farre
        : SPRAK.ui.visa_alla.replace("{antal}", totalt);
      mer.addEventListener("click", function () {
        visaAllaFiler = !visaAllaFiler;
        ritaFiler();
      });
      fillistan.appendChild(mer);
    }
  }

  function filrad(namn) {
    var f = arbetsyta[namn];
    var rad = document.createElement("button");
    rad.className = "filrad" + (namn === aktivFil ? " vald" : "");
    var etikett = document.createElement("span");
    etikett.textContent = namn + (f.andrad ? " •" : "");
    rad.appendChild(etikett);
    if (!horTillKursen(f)) {
      var byt = document.createElement("button");
      byt.className = "bort dop-om";
      byt.textContent = "✎";
      byt.title = SPRAK.ui.dop_om;
      byt.addEventListener("click", function (e) {
        e.stopPropagation();
        var nytt = fragaOmNamn(namn);
        if (nytt) dopOm(namn, nytt);
      });
      rad.appendChild(byt);
      var bort = document.createElement("button");
      bort.className = "bort";
      bort.textContent = "×";
      bort.title = SPRAK.ui.ta_bort;
      bort.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!confirm(SPRAK.fraga.radera_fil.replace("{namn}", namn))) return;
        delete arbetsyta[namn];
        if (aktivFil === namn) visaStartsida();
        else ritaFiler();
        sparaSnart();
      });
      rad.appendChild(bort);
    }
    rad.addEventListener("click", function () { oppna(namn); });
    return rad;
  }

  /* Dialogen öppnas tom, som i VS Code och PyCharm. Ett förifyllt namn
     inbjuder till att bara trycka Enter, och då blir varje fil hetande
     samma sak. Lämnar man tomt får filen ett neutralt untitled-namn. */
  function ledigtNamn(stam) {
    var namn = stam + ".py";
    var n = 1;
    while (arbetsyta[namn]) { namn = stam + n + ".py"; n++; }
    return namn;
  }

  /* Byter en fils namn i arbetsytan. Nyckeln ÄR namnet, så posten
     flyttas — och samtalet med AI-hjälpen följer med, eftersom det
     nycklas på samma sätt. Rör aldrig hårddisken. */
  function dopOm(gammalt, nytt) {
    if (!arbetsyta[gammalt] || gammalt === nytt) return false;
    var f = arbetsyta[gammalt];
    delete arbetsyta[gammalt];
    f.namn = nytt;
    arbetsyta[nytt] = f;
    if (samtalen[gammalt]) {
      samtalen[nytt] = samtalen[gammalt];
      delete samtalen[gammalt];
    }
    if (aktivFil === gammalt) {
      aktivFil = nytt;
      filnamn = nytt;
      visaFilnamn();
    }
    ritaFiler();
    sparaSnart();
    return true;
  }

  /* Frågar efter ett nytt namn och kontrollerar att det går att importera. */
  function fragaOmNamn(nuvarande) {
    var svar = prompt(SPRAK.fraga.dop_om, nuvarande);
    if (svar === null) return null;
    var namn = svar.trim();
    if (!namn || namn === nuvarande) return null;
    if (!/\.py$/.test(namn)) namn += ".py";
    if (!gangbartNamn(namn)) { alert(SPRAK.fraga.ogiltigt_namn); return null; }
    if (arbetsyta[namn]) { alert(SPRAK.fraga.namnet_upptaget.replace("{namn}", namn)); return null; }
    return namn;
  }

  function nyFil() {
    var svar = prompt(SPRAK.fraga.nytt_filnamn, "");
    if (svar === null) return;                    // avbrutet
    var namn = svar.trim();
    if (!namn) {
      namn = ledigtNamn("untitled");
    } else {
      if (!/\.py$/.test(namn)) namn += ".py";
      if (!gangbartNamn(namn)) { alert(SPRAK.fraga.ogiltigt_namn); return; }
      if (arbetsyta[namn]) { oppna(namn); return; }
    }
    // Tom fil. En mall med exempelkod är alltid fel för någon, och det
    // första man gör är att radera den.
    sakerstallFil(namn, "", null, true);
    oppna(namn);
    sparaSnart();
  }

  /* ================= syntaxfärgning =================
     En liten tokeniserare för Python. Ett enda reguljärt uttryck går
     igenom texten i ordning, så en nyckelordsträff inuti en sträng eller
     kommentar kan aldrig uppstå — den delen har redan konsumerats. */
  var kodfarg = document.getElementById("kodfarg");

  var NYCKELORD = ("False None True and as assert async await break class continue " +
    "def del elif else except finally for from global if import in is lambda " +
    "nonlocal not or pass raise return try while with yield match case").split(" ");
  var INBYGGDA = ("abs all any bool bytes callable chr dict dir divmod enumerate " +
    "eval filter float format frozenset getattr hasattr hash help hex id input int " +
    "isinstance issubclass iter len list map max min next object oct open ord pow " +
    "print range repr reversed round set setattr slice sorted str sum tuple type zip " +
    "self cls super").split(" ");

  var MONSTER = new RegExp([
    "(#[^\\n]*)",                                       // kommentar
    '([rbfu]{0,2}"""[\\s\\S]*?(?:"""|$))',              // trippelsträngar
    "([rbfu]{0,2}'''[\\s\\S]*?(?:'''|$))",
    '([rbfu]{0,2}"(?:[^"\\\\\\n]|\\\\.)*(?:"|$))',      // vanliga strängar
    "([rbfu]{0,2}'(?:[^'\\\\\\n]|\\\\.)*(?:'|$))",
    "(@[A-Za-z_]\\w*)",                                 // dekorator
    "\\b(\\d[\\w.]*)",                                  // tal
    "\\b([A-Za-z_]\\w*)"                                // ord
  ].join("|"), "g");

  function flyKod(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fargaKod(kod) {
    var ut = "";
    var sist = 0;
    var m;
    MONSTER.lastIndex = 0;
    while ((m = MONSTER.exec(kod)) !== null) {
      ut += flyKod(kod.slice(sist, m.index));
      sist = MONSTER.lastIndex;
      if (m[1]) {
        ut += '<span class="komm">' + flyKod(m[1]) + "</span>";
      } else if (m[2] || m[3] || m[4] || m[5]) {
        ut += '<span class="strang">' + flyKod(m[2] || m[3] || m[4] || m[5]) + "</span>";
      } else if (m[6]) {
        ut += '<span class="dekor">' + flyKod(m[6]) + "</span>";
      } else if (m[7]) {
        ut += '<span class="tal">' + flyKod(m[7]) + "</span>";
      } else if (m[8]) {
        var ord = m[8];
        var klass = NYCKELORD.indexOf(ord) >= 0 ? "nyckel"
                  : INBYGGDA.indexOf(ord) >= 0 ? "inbyggd"
                  : kod.charAt(MONSTER.lastIndex) === "(" ? "namn" : "vanlig";
        ut += '<span class="' + klass + '">' + flyKod(ord) + "</span>";
      }
    }
    ut += flyKod(kod.slice(sist));
    return ut;
  }

  function ritaFarger() {
    // Den avslutande radbrytningen sväljs annars av webbläsaren, och då
    // hamnar sista raden fel i förhållande till textrutan.
    kodfarg.innerHTML = fargaKod(kodruta.value) + "\n";
    kodfarg.scrollTop = kodruta.scrollTop;
    kodfarg.scrollLeft = kodruta.scrollLeft;
  }

  /* ================= sök, ersätt och gå till rad =================
     Arbetar direkt mot textrutan. Ctrl+F söker, Ctrl+H visar även
     ersättningsfältet, Ctrl+G hoppar till en rad. Escape stänger. */
  var sokraden = document.getElementById("sokrad");
  var sokfalt = document.getElementById("sokfalt");
  var ersattfalt = document.getElementById("ersattfalt");
  var soktraffar = document.getElementById("soktraffar");

  function visaSok(medErsatt) {
    sokraden.hidden = false;
    sokraden.classList.toggle("med-ersatt", !!medErsatt);
    var vald = kodruta.value.slice(kodruta.selectionStart, kodruta.selectionEnd);
    if (vald && vald.indexOf("\n") < 0) sokfalt.value = vald;
    sokfalt.focus();
    sokfalt.select();
    raknaTraffar();
  }

  function doljSok() {
    sokraden.hidden = true;
    ritaTraffar(null);
    kodruta.focus();
  }

  function alla(text, sokt) {
    var platser = [];
    if (!sokt) return platser;
    var i = text.toLowerCase().indexOf(sokt.toLowerCase());
    while (i >= 0) {
      platser.push(i);
      i = text.toLowerCase().indexOf(sokt.toLowerCase(), i + sokt.length);
    }
    return platser;
  }

  var traffLager = document.getElementById("traffar");

  /* Målar en bakgrund bakom varje träff, och en starkare bakom den man
     står på. Ligger i ett eget lager så att syntaxfärgningen ovanpå
     lämnas orörd. */
  function ritaTraffar(platser, langd, aktiv) {
    if (!platser || !platser.length) { traffLager.textContent = ""; return; }
    var text = kodruta.value;
    var ut = "";
    var sist = 0;
    platser.forEach(function (i) {
      ut += flyKod(text.slice(sist, i));
      ut += '<span class="traff' + (i === aktiv ? " aktiv" : "") + '">' +
            flyKod(text.substr(i, langd)) + "</span>";
      sist = i + langd;
    });
    ut += flyKod(text.slice(sist));
    traffLager.innerHTML = ut + "\n";
    traffLager.scrollTop = kodruta.scrollTop;
    traffLager.scrollLeft = kodruta.scrollLeft;
  }

  function raknaTraffar() {
    var sokt = sokfalt.value;
    var platser = alla(kodruta.value, sokt);
    if (!sokt) {
      soktraffar.textContent = "";
      ritaTraffar(null);
      return;
    }
    var nu = platser.indexOf(kodruta.selectionStart);
    ritaTraffar(platser, sokt.length, nu >= 0 ? platser[nu] : -1);
    soktraffar.textContent = platser.length
      ? (nu >= 0 ? (nu + 1) + "/" : "") + platser.length
      : SPRAK.ui.ingen_traff;
  }

  /* Hoppar till nästa träff efter markören, eller runt till början. */
  function sokVidare(bakat) {
    var sokt = sokfalt.value;
    if (!sokt) return;
    var platser = alla(kodruta.value, sokt);
    if (!platser.length) { raknaTraffar(); return; }
    var fran = kodruta.selectionStart;
    var mal;
    if (bakat) {
      mal = platser.filter(function (i) { return i < fran; }).pop();
      if (mal === undefined) mal = platser[platser.length - 1];
    } else {
      mal = platser.find(function (i) { return i > fran; });
      if (mal === undefined) mal = platser[0];
    }
    valjOchVisa(mal, mal + sokt.length);
    raknaTraffar();
  }

  function ersattEn() {
    var sokt = sokfalt.value;
    if (!sokt) return;
    var vald = kodruta.value.slice(kodruta.selectionStart, kodruta.selectionEnd);
    if (vald.toLowerCase() === sokt.toLowerCase()) {
      var start = kodruta.selectionStart;
      satt(kodruta.value.slice(0, start) + ersattfalt.value +
           kodruta.value.slice(kodruta.selectionEnd));
      valjOchVisa(start, start + ersattfalt.value.length);
    }
    sokVidare(false);
  }

  function ersattAlla() {
    var sokt = sokfalt.value;
    if (!sokt) return;
    var platser = alla(kodruta.value, sokt);
    if (!platser.length) return;
    var text = kodruta.value;
    for (var i = platser.length - 1; i >= 0; i--) {
      text = text.slice(0, platser[i]) + ersattfalt.value +
             text.slice(platser[i] + sokt.length);
    }
    satt(text);
    soktraffar.textContent = SPRAK.ui.ersatta.replace("{antal}", platser.length);
  }

  /* Skriver ny text och håller allt som hänger på den uppdaterat. */
  function satt(text) {
    kodruta.value = text;
    markeraAndrad();
    ritaRadnummer();
    ritaFarger();
    if (!sokraden.hidden) raknaTraffar();
  }

  function valjOchVisa(start, slut) {
    kodruta.focus();
    kodruta.setSelectionRange(start, slut);
    var rad = kodruta.value.slice(0, start).split("\n").length;
    var radhojd = kodruta.scrollHeight / Math.max(1, kodruta.value.split("\n").length);
    kodruta.scrollTop = Math.max(0, (rad - 1) * radhojd - kodruta.clientHeight / 2);
    radspalt.scrollTop = kodruta.scrollTop;
    kodfarg.scrollTop = kodruta.scrollTop;
    traffLager.scrollTop = kodruta.scrollTop;
    if (!sokraden.hidden) sokfalt.focus();
  }

  function gaTillRad() {
    var rader = kodruta.value.split("\n");
    var svar = prompt(SPRAK.fraga.ga_till_rad.replace("{antal}", rader.length), "");
    if (svar === null) return;
    var nr = parseInt(svar, 10);
    if (!nr || nr < 1) return;
    nr = Math.min(nr, rader.length);
    var start = 0;
    for (var i = 0; i < nr - 1; i++) start += rader[i].length + 1;
    valjOchVisa(start, start + rader[nr - 1].length);
    kodruta.focus();
    markeraFelrad(0);
  }

  sokfalt.addEventListener("input", raknaTraffar);
  sokfalt.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sokVidare(e.shiftKey); }
    else if (e.key === "Escape") { e.preventDefault(); doljSok(); }
  });
  ersattfalt.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ersattEn(); }
    else if (e.key === "Escape") { e.preventDefault(); doljSok(); }
  });
  document.getElementById("sok-nasta").addEventListener("click", function () { sokVidare(false); });
  document.getElementById("sok-forra").addEventListener("click", function () { sokVidare(true); });
  document.getElementById("sok-ersatt").addEventListener("click", ersattEn);
  document.getElementById("sok-ersatt-alla").addEventListener("click", ersattAlla);
  document.getElementById("sok-stang").addEventListener("click", doljSok);

  /* ---- radnummer ---- */
  var radspalt = document.getElementById("radnummer");
  var felradNu = 0;

  function ritaRadnummer() {
    var antal = kodruta.value.split("\n").length;
    var bitar = [];
    for (var i = 1; i <= antal; i++) {
      bitar.push(i === felradNu ? '<b class="fel">' + i + "</b>" : "<b>" + i + "</b>");
    }
    radspalt.innerHTML = bitar.join("");
    radspalt.scrollTop = kodruta.scrollTop;
  }

  /* Markerar raden ett fel pekar på och rullar dit. */
  function markeraFelrad(rad) {
    felradNu = rad || 0;
    ritaRadnummer();
    if (!rad) return;
    var radhojd = kodruta.scrollHeight / Math.max(1, kodruta.value.split("\n").length);
    var mitt = (rad - 1) * radhojd - kodruta.clientHeight / 2 + radhojd;
    kodruta.scrollTop = Math.max(0, mitt);
    radspalt.scrollTop = kodruta.scrollTop;
  }

  kodruta.addEventListener("scroll", function () {
    radspalt.scrollTop = kodruta.scrollTop;
    kodfarg.scrollTop = kodruta.scrollTop;
    kodfarg.scrollLeft = kodruta.scrollLeft;
    traffLager.scrollTop = kodruta.scrollTop;
    traffLager.scrollLeft = kodruta.scrollLeft;
  });
  kodruta.addEventListener("input", function () {
    if (felradNu) felradNu = 0;
    ritaRadnummer();
    ritaFarger();
    if (!sokraden.hidden) raknaTraffar();
  });

  function markeraAndrad() {
    if (!andrad) { andrad = true; visaFilnamn(); }
    if (aktivFil && arbetsyta[aktivFil]) {
      arbetsyta[aktivFil].kod = kodruta.value;
      arbetsyta[aktivFil].andrad = true;
    }
    ritaFiler();
    sparaSnart();
  }
  function markeraSparad() { andrad = false; visaFilnamn(); sparaAktiv(); ritaFiler(); sparaSnart(); }

  function harFilsystem() {
    return typeof window.showSaveFilePicker === "function";
  }

  function laddaNer() {
    var blob = new Blob([kodruta.value], { type: "text/x-python;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var lank = document.createElement("a");
    lank.href = url;
    lank.download = filnamn;
    document.body.appendChild(lank);
    lank.click();
    document.body.removeChild(lank);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    markeraSparad();
    visaFlik("utskrift");
    skriv(SPRAK.msg.sparad_hamtade.replace("{namn}", filnamn) + "\n", "system");
  }

  async function sparaFil(sparaSom) {
    if (harFilsystem()) {
      try {
        var handtag = filhandtag;
        if (!handtag || sparaSom) {
          handtag = await window.showSaveFilePicker({ suggestedName: filnamn, types: FILTYP });
        }
        var strom = await handtag.createWritable();
        await strom.write(kodruta.value);
        await strom.close();
        filhandtag = handtag;
        // Filen finns nu på disken under det här namnet, så den ska
        // heta samma sak i arbetsytan.
        if (aktivFil && handtag.name !== aktivFil && !arbetsyta[handtag.name]) {
          dopOm(aktivFil, handtag.name);
        }
        filnamn = handtag.name;
        if (arbetsyta[aktivFil]) arbetsyta[aktivFil].filhandtag = handtag;
        markeraSparad();
        visaFlik("utskrift");
        skriv(SPRAK.msg.sparad_till.replace("{namn}", filnamn) + "\n", "system");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    if (sparaSom || !filnamn) {
      var nytt = prompt(SPRAK.fraga.filnamn, filnamn);
      if (!nytt) return;
      var onskat = nytt.trim();
      if (onskat.slice(-3) !== ".py") onskat += ".py";
      if (aktivFil && onskat !== aktivFil && !arbetsyta[onskat]) dopOm(aktivFil, onskat);
      filnamn = onskat;
    }
    laddaNer();
  }

  /* Läser in en fil i den buffert man står i. Koden ligger sedan kvar
     där tills man trycker Återställ, precis som all annan redigering. */
  /* En fil från hårddisken blir en fil i arbetsytan — samma sak som
     allt annat, och därmed importerbar. */
  function laddaText(text, namn, handtag) {
    if (!gangbartNamn(namn) && !confirm(SPRAK.fraga.ej_importerbar.replace("{namn}", namn))) return;
    if (arbetsyta[namn] && arbetsyta[namn].kod !== text &&
        !confirm(SPRAK.fraga.ersatt_fil.replace("{namn}", namn))) return;
    sparaAktiv();
    var f = sakerstallFil(namn, text, null, true);
    f.kod = text;
    f.filhandtag = handtag || null;
    f.andrad = false;
    f.markor = 0;
    f.rullning = 0;
    aktivFil = null;
    oppna(namn);
    visaFlik("utskrift");
    rensaKonsol();
    skriv(SPRAK.msg.oppnade.replace("{namn}", namn).replace("{plats}", kapitelnamn()) + "\n", "system");
    byteAvSamtal();
  }

  async function oppnaFil() {
    if (typeof window.showOpenFilePicker === "function") {
      try {
        var val = await window.showOpenFilePicker({ types: FILTYP });
        var handtag = val[0];
        var fil = await handtag.getFile();
        laddaText(await fil.text(), handtag.name, handtag);
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    filvaljare.click();
  }

  filvaljare.addEventListener("change", function () {
    var fil = filvaljare.files && filvaljare.files[0];
    if (!fil) return;
    var lasare = new FileReader();
    lasare.onload = function () { laddaText(String(lasare.result), fil.name, null); };
    lasare.readAsText(fil);
    filvaljare.value = "";
  });

  ["dragenter", "dragover"].forEach(function (h) {
    redigerare.addEventListener(h, function (e) { e.preventDefault(); redigerare.classList.add("slapp"); });
  });
  ["dragleave", "drop"].forEach(function (h) {
    redigerare.addEventListener(h, function (e) { e.preventDefault(); redigerare.classList.remove("slapp"); });
  });
  redigerare.addEventListener("drop", function (e) {
    var fil = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!fil) return;
    var lasare = new FileReader();
    lasare.onload = function () { laddaText(String(lasare.result), fil.name, null); };
    lasare.readAsText(fil);
  });

  window.addEventListener("beforeunload", function () {
    // Arbetsytan sparas i webbläsaren, så ingen varning behövs längre.
    sparaArbetsyta();
  });

  /* =======================================================
     Sidomenyn
     ======================================================= */
  function markeraVald(index) {
    var alla = document.getElementById("lektionslista").querySelectorAll(".lektion");
    for (var i = 0; i < alla.length; i++) alla[i].classList.toggle("vald", i === index);
    startKnapp.classList.toggle("vald", index === -2);
  }

  var STARTSIDA = lektionstext.innerHTML;

  /* ================= arbetsytan =================
     En enda princip: allt är filer. Kapitel, filer du läst in från
     hårddisken och filer du skapat själv ligger i samma struktur,
     nycklade på filnamn. Därför kan allt importeras, allt sparas och
     allt har ett namn som är sant.

     En post: { namn, kod, kapitel, filhandtag, andrad, egen, markor, rullning }
     Fältet kapitel är index i LEKTIONER, eller null. Det är det enda
     som skiljer en kapitelfil från en annan — Återställ behöver veta
     vilket original som gäller. */
  var arbetsyta = {};
  var aktivFil = null;

  var LAGER = { namn: "pytho", butik: "arbetsyta", nyckel: 1, format: 2 };
  var sparklocka = null;

  function huvudfil() { return SPRAK.ui.huvudfil || "huvudprogram.py"; }

  /* Ett giltigt modulnamn kan importeras. Siffra först duger inte. */
  function gangbartNamn(namn) {
    return /^[A-Za-z_]\w*\.py$/.test(namn);
  }

  function post(namn) { return arbetsyta[namn]; }

  /* Skapar posten om den saknas. Returnerar den alltid. */
  function sakerstallFil(namn, kod, kapitel, egen) {
    if (!arbetsyta[namn]) {
      arbetsyta[namn] = {
        namn: namn, kod: kod || "", kapitel: (kapitel === undefined ? null : kapitel),
        filhandtag: null, andrad: false, egen: !!egen,
        kurs: namn === huvudfil(),
        varld: (kapitel !== null && kapitel !== undefined) || namn === huvudfil()
               ? "kurs" : nuvarandeVarld(),
        markor: 0, rullning: 0
      };
    }
    return arbetsyta[namn];
  }

  /* Vid språkbyte ska texterna följa med — men bara i filer du inte
     rört. Har du skrivit något är det ditt, oavsett språk. */
  function foljSpraket() {
    Object.keys(arbetsyta).forEach(function (n) {
      var f = arbetsyta[n];
      if (f.andrad) return;
      if (f.kurs) f.kod = STARTKOD;
      else if (n === DEV_DEMO) f.kod = SPRAK.ui.scene_demo;
      else if (f.kapitel !== null && LEKTIONER[f.kapitel] &&
               LEKTIONER[f.kapitel].fil === n) {
        f.kod = LEKTIONER[f.kapitel].kod;
      }
    });
    // Kapitelfiler från ett annat språk heter något annat och går inte
    // att nå via kapitellistan. Orörda sådana städas bort; har du
    // ändrat i dem får de vara kvar som vanliga filer.
    Object.keys(arbetsyta).forEach(function (n) {
      var f = arbetsyta[n];
      if (f.kapitel === null || f.andrad) return;
      if (!LEKTIONER[f.kapitel] || LEKTIONER[f.kapitel].fil !== n) {
        delete arbetsyta[n];
      }
    });
  }

  /* Tillhörigheten sitter på filen, inte i en namnjämförelse. En sparad
     arbetsyta från en tidigare version saknar fältet — då sätts det här,
     en gång, utifrån namnet. */
  function normaliseraArbetsyta() {
    Object.keys(arbetsyta).forEach(function (n) {
      var f = arbetsyta[n];
      if (f.kurs === undefined) f.kurs = (n === huvudfil());
      if (f.kapitel === undefined) f.kapitel = null;
      if (!f.varld) f.varld = (f.kapitel !== null || f.kurs) ? "kurs" : "dev";
      // Startfilen beter sig som ett kapitel: den listas när den är
      // ändrad eller öppen, inte annars.
      if (f.kurs) f.egen = false;
      f.namn = n;
    });
  }

  /* ---- lagring ---- */
  function oppnaLager() {
    return new Promise(function (klar, fel) {
      if (!window.indexedDB) return fel(new Error("ingen lagring"));
      var beg = indexedDB.open(LAGER.namn, 1);
      beg.onupgradeneeded = function () { beg.result.createObjectStore(LAGER.butik); };
      beg.onsuccess = function () { klar(beg.result); };
      beg.onerror = function () { fel(beg.error); };
    });
  }

  async function sparaArbetsyta() {
    sparaAktiv();
    var rena = {};
    Object.keys(arbetsyta).forEach(function (n) {
      var f = arbetsyta[n];
      rena[n] = { namn: f.namn, kod: f.kod, kapitel: f.kapitel,
                  andrad: f.andrad, egen: f.egen, kurs: f.kurs, varld: f.varld,
                  markor: f.markor, rullning: f.rullning };
    });
    try {
      var db = await oppnaLager();
      db.transaction(LAGER.butik, "readwrite").objectStore(LAGER.butik).put(
        { format: LAGER.format, filer: rena, aktiv: aktivFil, dev: devlage,
          devfiler: devfilerSkapade,
          sparad: Date.now(), version: window.PYTHONLABBET_VERSION },
        LAGER.nyckel);
      db.close();
    } catch (e) { /* lagring kan vara avstängd — kör vidare utan */ }
  }

  function sparaSnart() {
    clearTimeout(sparklocka);
    sparklocka = setTimeout(sparaArbetsyta, 800);
  }

  /* Läser in en sparad arbetsyta. Data från det gamla formatet med
     separata buffertar och filer översätts en gång, så att ingen
     förlorar det de skrivit. */
  async function laddaArbetsyta() {
    var data;
    try {
      var db = await oppnaLager();
      data = await new Promise(function (klar, fel) {
        var b = db.transaction(LAGER.butik, "readonly")
                  .objectStore(LAGER.butik).get(LAGER.nyckel);
        b.onsuccess = function () { klar(b.result); };
        b.onerror = function () { fel(b.error); };
      });
      db.close();
    } catch (e) { return false; }
    if (!data) return false;

    if (data.format === LAGER.format) {
      Object.keys(data.filer || {}).forEach(function (n) {
        arbetsyta[n] = Object.assign({ filhandtag: null }, data.filer[n]);
      });
      devfilerSkapade = !!data.devfiler;
      // Namnbytet måste ske FÖRE normaliseringen: den avgör tillhörighet
      // utifrån namnet, och skulle annars stämpla startfilen som en
      // utvecklarfil bara för att den heter något gammalt.
      ["huvudprogram.py", "main_program.py"].forEach(function (gammalt) {
        if (arbetsyta[gammalt] && !arbetsyta[huvudfil()]) {
          arbetsyta[huvudfil()] = arbetsyta[gammalt];
          arbetsyta[huvudfil()].namn = huvudfil();
          arbetsyta[huvudfil()].kurs = true;
          arbetsyta[huvudfil()].varld = "kurs";
          delete arbetsyta[gammalt];
          if (data.aktiv === gammalt) data.aktiv = huvudfil();
        }
      });
      normaliseraArbetsyta();
      foljSpraket();
      return data;
    }
    return migrera(data);
  }

  function migrera(gammal) {
    Object.keys(gammal.filer || {}).forEach(function (n) {
      sakerstallFil(n, gammal.filer[n], null, true).andrad = true;
    });
    Object.keys(gammal.buffertar || {}).forEach(function (nyckel) {
      var b = gammal.buffertar[nyckel];
      if (!b || !b.kod) return;
      if (nyckel === "start") {
        sakerstallFil(huvudfil(), b.kod, null, true).andrad = true;
      } else if (nyckel.indexOf("kap:") === 0) {
        var i = parseInt(nyckel.slice(4), 10);
        var lek = LEKTIONER[i];
        if (!lek || b.kod === lek.kod) return;      // orörd — hoppa över
        var f = sakerstallFil(lek.fil, b.kod, i, false);
        f.kod = b.kod;
        f.andrad = true;
      } else if (nyckel.indexOf("fil:") === 0) {
        sakerstallFil(nyckel.slice(4), b.kod, null, true).andrad = true;
      }
    });
    normaliseraArbetsyta();
    foljSpraket();
    return { aktiv: null, dev: gammal.dev, migrerad: true };
  }

  /* ---- att byta fil ---- */
  function sparaAktiv() {
    if (!aktivFil || !arbetsyta[aktivFil]) return;
    var f = arbetsyta[aktivFil];
    f.kod = kodruta.value;
    f.andrad = andrad;
    f.filhandtag = filhandtag;
    f.markor = kodruta.selectionStart;
    f.rullning = kodruta.scrollTop;
  }

  function oppna(namn) {
    var f = arbetsyta[namn];
    if (!f) return;
    if (aktivFil !== namn) sparaAktiv();
    aktivFil = namn;
    kodruta.value = f.kod;
    filnamn = f.namn;
    filhandtag = f.filhandtag;
    andrad = f.andrad;
    visaFilnamn();
    kodruta.scrollTop = f.rullning;
    var pos = Math.min(f.markor || 0, kodruta.value.length);
    kodruta.setSelectionRange(pos, pos);
    sistaMarkering = { start: 0, slut: 0 };
    felradNu = 0;
    ritaRadnummer();
    ritaFarger();
    ritaTraffar(null);
    markeraVald(f.kapitel === null ? -1 : f.kapitel);
    if (f.kapitel === null) document.getElementById("uppgiftsrad").hidden = true;
    else visaUppgift(LEKTIONER[f.kapitel].forklaring);
    aterstallKapitelKnapp.textContent = knapptextAterstall();
    ritaFiler();
    byteAvSamtal();
  }

  /* Originalet att gå tillbaka till: kapitlets kod för en kapitelfil,
     startprogrammet för startfilen, inget för en fil du skapat själv. */
  /* Hör filen till kursen? Kapitlen och startfilen gör det — de har
     ett original, kan inte tas bort, och grupperas ihop. */
  /* Varje fil hör till en värld: kursen eller utvecklarläget. Den värld
     man inte står i läggs hopfälld längst ner. Symmetriskt åt båda håll —
     kapitlen skräpar inte i utvecklarläget, och utvecklarfilerna skräpar
     inte i kursen. */
  function horTillKursen(f) {
    return !!f && varldFor(f) === "kurs";
  }

  function varldFor(f) {
    if (!f) return "kurs";
    if (f.varld) return f.varld;
    return (f.kapitel !== null || f.kurs === true) ? "kurs" : "dev";
  }

  function nuvarandeVarld() { return devlage ? "dev" : "kurs"; }

  function originalFor(f) {
    if (!f) return null;
    if (f.kapitel !== null) return LEKTIONER[f.kapitel].kod;
    if (f.kurs) return STARTKOD;
    return null;
  }

  function knapptextAterstall() {
    return originalFor(post(aktivFil)) !== null
      ? SPRAK.ui.aterstall : SPRAK.ui.tom_fil;
  }

  function aktivtKapitel() {
    var f = post(aktivFil);
    return f ? f.kapitel : null;
  }

  /* ---- vyerna ---- */
  function visaStartsida() {
    sparaAktiv();
    sakerstallFil(huvudfil(), STARTKOD, null, true).kurs = true;
    oppna(huvudfil());
    markeraVald(-2);
    lektionstext.innerHTML = STARTSIDA;
    lektionstext.className = "lektionstext start";
    document.getElementById("uppgiftsrad").hidden = true;
    panelLektion.scrollTop = 0;
    visaFlik("lektion");
  }
  startKnapp.addEventListener("click", visaStartsida);

  /* Plockar ut uppgiften ur kapiteltexten och lägger den överst i
     redigeraren, så att den syns medan man skriver. */
  function visaUppgift(forklaring) {
    var raden = document.getElementById("uppgiftsrad");
    var burk = document.createElement("div");
    burk.innerHTML = forklaring || "";
    var uppgift = burk.querySelector(".uppgift");
    if (!uppgift) { raden.hidden = true; return; }
    var text = (uppgift.textContent || "").replace(/\s+/g, " ").trim();
    document.getElementById("uppgiftsrubrik").textContent = text;
    document.getElementById("uppgiftstext").innerHTML = uppgift.innerHTML;
    raden.hidden = false;
  }

  function oppnaLektion(i) {
    var lek = LEKTIONER[i];
    sakerstallFil(lek.fil, lek.kod, i, false);
    oppna(lek.fil);
    lektionstext.innerHTML = "<h3>" + SPRAK.ord.kapitel_rubrik
      .replace("{nr}", i + 1).replace("{titel}", lek.titel) + "</h3>" + lek.forklaring;
    lektionstext.className = "lektionstext";
    visaUppgift(lek.forklaring);
    panelLektion.scrollTop = 0;
    visaFlik("lektion");
  }

  /* Återställ: kapitlets original, eller tom fil om inget original finns. */
  function aterstallKapitel() {
    var f = post(aktivFil);
    if (!f) return;
    var original = originalFor(f);
    if (original !== null) {
      if (kodruta.value !== original &&
          !confirm(SPRAK.fraga.aterstall.replace("{plats}", f.namn))) return;
      f.kod = original;
      f.andrad = false;
    } else {
      if (!kodruta.value.trim()) return;
      if (!confirm(SPRAK.fraga.tom_fil.replace("{namn}", f.namn))) return;
      f.kod = "";
      f.andrad = true;
    }
    f.markor = 0;
    f.rullning = 0;
    aktivFil = null;            // tvinga full omladdning av rutan
    oppna(f.namn);
    rensaKonsol();
    sparaSnart();
    kodruta.focus();
  }
  aterstallKapitelKnapp.addEventListener("click", aterstallKapitel);


  function ritaLektioner() {
    var behallare = document.getElementById("lektionslista");
    behallare.textContent = "";
    var senasteDel = null;
    LEKTIONER.forEach(function (lek, i) {
      if (lek.del !== senasteDel) {
        var d = document.createElement("p");
        d.className = "delrubrik" + (senasteDel === null ? " forst" : "");
        d.textContent = lek.del;
        behallare.appendChild(d);
        senasteDel = lek.del;
      }
      var knapp = document.createElement("button");
      knapp.className = "lektion";
      var nr = document.createElement("span");
      nr.className = "nr";
      nr.textContent = String(i + 1).padStart(2, "0");
      var namn = document.createElement("span");
      namn.textContent = lek.titel;
      knapp.appendChild(nr);
      knapp.appendChild(namn);
      knapp.addEventListener("click", function () { oppnaLektion(i); });
      behallare.appendChild(knapp);
    });
  }

  /* =======================================================

  var LABB_FAKTA = SPRAK.ai_fakta;

  function lararroll() {
    var mall = devlage && SPRAK.ai_roll_dev ? SPRAK.ai_roll_dev : SPRAK.ai_roll;
    return mall.replace("{fakta}", LABB_FAKTA);

  /* Byggs ur kapitellistan så den aldrig blir inaktuell. */
  var KURSEN = (function () {

    });

  function aiElement(id) { return document.getElementById(id); }

  var chattEl = aiElement("ai-chatt");
  var fragaFalt = aiElement("ai-fraga");
  var skickaKnapp = aiElement("ai-skicka");
  var kontextEl = aiElement("ai-kontext");

  function fyllStandard() {

  function sattAiStatus(text, klass) {

    el.className = "ai-status " + (klass || "");

  var samtalen = {};          // en chatt per kapitel, plus en för egna filer
  var arbetar = false;

  /* En chatt per fil — samma nyckel som arbetsytan använder. */
  function samtalsnyckel() {
    return aktivFil || "start";
  }

  function aktivtSamtal() {
    var nyckel = samtalsnyckel();
    if (!samtalen[nyckel]) samtalen[nyckel] = { visning: [], meddelanden: [] };
    return samtalen[nyckel];

  /* Ritar om chattrutan från det sparade samtalet. */
  function ritaSamtal() {

        : SPRAK.chatt.ny;

    }

  }

  function byteAvSamtal() {
    if (!ai.pa) return;
    visaKontext();
    ritaSamtal();
  }

  /* Plockar ut ren text ur kapitelrutan. */
  function kapiteltext() {
    var kopia = document.createElement("div");
    kopia.innerHTML = lektionstext.innerHTML;
    var text = (kopia.textContent || "").replace(/\s+/g, " ").trim();
    return text.length > 2600 ? text.slice(0, 2600) + " …" : text;
  }

  function kapitelnamn() {
    var i = aktivtKapitel();
    if (i === null) return aktivFil || SPRAK.chatt.startsidan;
    return SPRAK.chatt.kapitel.replace("{nr}", i + 1)
                              .replace("{titel}", LEKTIONER[i].titel);
  }

  /* Sammanställer vad användaren har framför sig just nu. */
  function nulage() {
    var kod = kodruta.value;
    if (kod.length > 4000) kod = kod.slice(0, 4000) + "\n# " + SPRAK.ai_nulage.avkortad;
    var delar = [
      SPRAK.ai_nulage.rubrik,
      SPRAK.ai_nulage.oppet + kapitelnamn(),
      "",
      SPRAK.ai_nulage.kapiteltext,
      kapiteltext() || SPRAK.ai_nulage.ingen,
      "",
      SPRAK.ai_nulage.kod,
      "```python",
      kod,
      "```"
    ];

    var vald = markeradKod();
    if (vald.trim()) {
      delar.push("", SPRAK.ai_nulage.markering, "```python", vald.trim(), "```");
    }
    return delar.join("\n");
  }

  var sistaMarkering = { start: 0, slut: 0 };

  function markeradKod() {
    var a = kodruta.selectionStart, b = kodruta.selectionEnd;
    if (b > a) return kodruta.value.slice(a, b);
    // Textrutan kan ha tappat markeringen när fokus flyttades.
    if (sistaMarkering.slut > sistaMarkering.start &&
        sistaMarkering.slut <= kodruta.value.length) {
      return kodruta.value.slice(sistaMarkering.start, sistaMarkering.slut);
    }
    return "";
  }

  /* Lägger tillbaka markeringen och fokus i kodrutan, så att den syns
     kvar efter att man klickat på en knapp som arbetar mot den. */
  function aterstallMarkering() {
    if (sistaMarkering.slut > sistaMarkering.start &&
        sistaMarkering.slut <= kodruta.value.length) {
      kodruta.focus();
      kodruta.setSelectionRange(sistaMarkering.start, sistaMarkering.slut);
    }
  }

  function kommIhagMarkering() {
    var a = kodruta.selectionStart, b = kodruta.selectionEnd;
    if (b > a) sistaMarkering = { start: a, slut: b };
    else sistaMarkering = { start: 0, slut: 0 };
  }

  function visaKontext() {
    var vald = markeradKod().trim();
    var rader = vald ? vald.split("\n").length : 0;
    kontextEl.textContent = vald
      ? SPRAK.chatt.kontext_markerat.replace("{plats}", kapitelnamn()).replace("{rader}", rader)
      : SPRAK.chatt.kontext_allt.replace("{plats}", kapitelnamn());
  }

  async function fragaModellen(meddelanden, systemtext) {
    var namn = aiElement("ai-leverantor").value;
    var stil = LEVERANTORER[namn].stil;
    var url = aiElement("ai-url").value.trim();
    var modell = aiElement("ai-modell").value.trim();
    var nyckel = aiElement("ai-nyckel").value.trim();
    if (!url) throw new Error("Ingen adress angiven.");
    if (!modell) throw new Error("Ingen modell angiven.");

    var system = systemtext || lararroll();
    var huvud = { "Content-Type": "application/json" };
    var kropp;

    if (stil === "anthropic") {
      huvud["x-api-key"] = nyckel;
      huvud["anthropic-version"] = "2023-06-01";
      huvud["anthropic-dangerous-direct-browser-access"] = "true";
      kropp = { model: modell, max_tokens: 900, system: system, messages: meddelanden };
    } else {
      if (nyckel) huvud["Authorization"] = "Bearer " + nyckel;
      kropp = {
        model: modell, max_tokens: 900,
        messages: [{ role: "system", content: system }].concat(meddelanden)
      };
    }

    var svar;
    try {
      svar = await fetch(url, { method: "POST", headers: huvud, body: JSON.stringify(kropp) });
    } catch (e) {
      throw new Error(SPRAK.chatt.nadde_inte.replace("{url}", url));
    }
    if (!svar.ok) {
      var text = await svar.text();
      throw new Error("Servern svarade " + svar.status + ": " + text.slice(0, 300));
    }
    var j = await svar.json();
    if (stil === "anthropic") {
      return (j.content || []).map(function (d) { return d.text || ""; }).join("").trim();
    }
    return ((j.choices && j.choices[0] && j.choices[0].message.content) || "").trim();
  }

  /* Liten markdown-tolk. Allt escapas först, så modellens svar kan
     aldrig injicera HTML i sidan. */
  function fly(text) {
    return String(text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(rad) {
    return rad
      .replace(/`([^`]+)`/g, function (_, k) { return "<code>" + k + "</code>"; })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>")
      .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>");
  }

  function markdown(text) {
    var kodblock = [];
    var matte = [];

    // 1. Plocka undan kodblock så de inte rörs av resten.
    var arbete = String(text).replace(/```([\w+-]*)\n?([\s\S]*?)```/g, function (_, sprak, kod) {
      kodblock.push('<pre class="kodblock"><code>' + fly(kod.replace(/\n$/, "")) + "</code></pre>");
      return "\u0000KOD" + (kodblock.length - 1) + "\u0000";
    });

    // 2. Plocka undan matematik: $$…$$, \[…\], $…$ och \(…\).
    function sparaMatte(inneh, block) {
      matte.push('<span class="matte' + (block ? " block" : "") + '">' +
                 latex(fly(inneh)) + "</span>");
      return "\u0000MAT" + (matte.length - 1) + "\u0000";
    }
    arbete = arbete
      .replace(/\$\$([\s\S]+?)\$\$/g, function (_, m) { return sparaMatte(m, true); })
      .replace(/\\\[([\s\S]+?)\\\]/g, function (_, m) { return sparaMatte(m, true); })
      .replace(/\\\(([\s\S]+?)\\\)/g, function (_, m) { return sparaMatte(m, false); })
      .replace(/(^|[^\\$])\$([^$\n]+?)\$/g, function (_, fore, m) {
        return fore + sparaMatte(m, false);
      });

    arbete = fly(arbete);
    var rader = arbete.split("\n");
    var ut = [];
    var lista = null;          // "ul" eller "ol" när vi är inne i en lista
    var stycke = [];

    function stangStycke() {
      if (stycke.length) {
        ut.push("<p>" + inline(stycke.join(" ")) + "</p>");
        stycke = [];
      }
    }
    function stangLista() {
      if (lista) { ut.push("</" + lista + ">"); lista = null; }
    }

    rader.forEach(function (rad) {
      var trim = rad.trim();

      if (/^\u0000KOD\d+\u0000$/.test(trim)) {
        stangStycke(); stangLista();
        ut.push(trim);
        return;
      }
      if (!trim) { stangStycke(); stangLista(); return; }

      var rubrik = trim.match(/^(#{1,4})\s+(.*)$/);
      if (rubrik) {
        stangStycke(); stangLista();
        var niva = Math.min(4, rubrik[1].length + 2);
        ut.push("<h" + niva + ">" + inline(rubrik[2]) + "</h" + niva + ">");
        return;
      }
      if (/^([-*•])\s+/.test(trim)) {
        stangStycke();
        if (lista !== "ul") { stangLista(); ut.push("<ul>"); lista = "ul"; }
        ut.push("<li>" + inline(trim.replace(/^([-*•])\s+/, "")) + "</li>");
        return;
      }
      var numrerad = trim.match(/^(\d+)[.)]\s+(.*)$/);
      if (numrerad) {
        stangStycke();
        if (lista !== "ol") { stangLista(); ut.push("<ol>"); lista = "ol"; }
        ut.push("<li>" + inline(numrerad[2]) + "</li>");
        return;
      }
      if (/^(---+|===+|\*\*\*+)$/.test(trim)) {
        stangStycke(); stangLista();
        ut.push("<hr>");
        return;
      }
      stangLista();
      stycke.push(trim);
    });
    stangStycke(); stangLista();

    var html = ut.join("\n");
    // Lägg tillbaka kodblock och matematik.
    return html
      .replace(/\u0000KOD(\d+)\u0000/g, function (_, i) { return kodblock[i]; })
      .replace(/\u0000MAT(\d+)\u0000/g, function (_, i) { return matte[i]; });
  }

  /* ---- liten LaTeX-tolk ----
     Täcker det som faktiskt dyker upp i en programmeringskurs:
     exponenter, index, bråk, rötter, grekiska bokstäver och operatorer.
     Renderas med <sup>, <sub> och lite CSS — inget bibliotek behövs. */
  var GREKISKA = {
    alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", zeta: "ζ",
    eta: "η", theta: "θ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ",
    nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ", phi: "φ",
    chi: "χ", psi: "ψ", omega: "ω",
    Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π",
    Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω"
  };
  var SYMBOLER = {
    times: "×", cdot: "·", div: "÷", pm: "±", mp: "∓",
    leq: "≤", le: "≤", geq: "≥", ge: "≥", neq: "≠", ne: "≠",
    approx: "≈", equiv: "≡", propto: "∝", sim: "∼",
    infty: "∞", partial: "∂", nabla: "∇", forall: "∀", exists: "∃",
    in: "∈", notin: "∉", subset: "⊂", cup: "∪", cap: "∩",
    sum: "∑", prod: "∏", int: "∫", sqrt: "√",
    rightarrow: "→", to: "→", leftarrow: "←", Rightarrow: "⇒",
    leftrightarrow: "↔", mapsto: "↦", ldots: "…", dots: "…", cdots: "⋯",
    quad: " ", qquad: "  ", ",": " ", ";": " ", " ": " "
  };

  /* Läser en grupp: antingen {…} eller ett enda tecken. */
  function grupp(src, i) {
    if (src[i] === "{") {
      var djup = 1, j = i + 1;
      while (j < src.length && djup > 0) {
        if (src[j] === "{") djup++;
        else if (src[j] === "}") djup--;
        j++;
      }
      return { text: src.slice(i + 1, j - 1), slut: j };
    }
    if (src[i] === "\\") {
      var m = /^\\[a-zA-Z]+/.exec(src.slice(i));
      if (m) return { text: m[0], slut: i + m[0].length };
    }
    return { text: src[i] || "", slut: i + 1 };
  }

  function latex(src) {
    var ut = "";
    var i = 0;
    while (i < src.length) {
      var c = src[i];

      if (c === "^" || c === "_") {
        var g = grupp(src, i + 1);
        var tagg = c === "^" ? "sup" : "sub";
        ut += "<" + tagg + ">" + latex(g.text) + "</" + tagg + ">";
        i = g.slut;
        continue;
      }

      if (c === "\\") {
        var kommando = /^\\([a-zA-Z]+|.)/.exec(src.slice(i));
        if (!kommando) { i++; continue; }
        var namn = kommando[1];
        var efter = i + kommando[0].length;

        if (namn === "frac" || namn === "dfrac" || namn === "tfrac") {
          var t = grupp(src, efter);
          var n = grupp(src, t.slut);
          ut += '<span class="brak"><span class="taljare">' + latex(t.text) +
                '</span><span class="namnare">' + latex(n.text) + "</span></span>";
          i = n.slut;
          continue;
        }
        if (namn === "sqrt") {
          var r = grupp(src, efter);
          ut += '√<span class="rot">' + latex(r.text) + "</span>";
          i = r.slut;
          continue;
        }
        if (namn === "text" || namn === "mathrm" || namn === "mathbf" ||
            namn === "operatorname" || namn === "mathit") {
          var tx = grupp(src, efter);
          var inneh = latex(tx.text);
          ut += namn === "mathbf" ? "<strong>" + inneh + "</strong>" : inneh;
          i = tx.slut;
          continue;
        }
        if (namn === "left" || namn === "right") { i = efter; continue; }
        if (GREKISKA[namn]) { ut += GREKISKA[namn]; i = efter; continue; }
        if (SYMBOLER[namn] !== undefined) { ut += SYMBOLER[namn]; i = efter; continue; }
        ut += namn;                      // okänt kommando: visa namnet
        i = efter;
        continue;
      }

      if (c === "{" || c === "}") { i++; continue; }
      if (c === "*") { ut += "·"; i++; continue; }
      ut += c;
      i++;
    }
    return ut;
  }

  function ritaBubbla(rubrik, text, klass) {
    var svarsyta = aiElement("ai-svar");
    if (rubrik) {
      var titel = document.createElement("p");
      titel.className = "fraga-eko";
      titel.textContent = rubrik;

    }
    var bubbla = document.createElement("div");
    bubbla.className = klass || "bubbla";
    // Bara assistentens svar tolkas som markdown. Egna frågor och
    // felmeddelanden visas ordagrant.
    if (!klass || klass === "bubbla") {
      bubbla.innerHTML = markdown(text);
    } else {
      bubbla.textContent = text;
    }
    svarsyta.appendChild(bubbla);
    svarsyta.scrollTop = svarsyta.scrollHeight;
    if (bubbla.scrollIntoView) bubbla.scrollIntoView({ block: "nearest" });
    return bubbla;
  }

  /* Ritar och sparar, så att bubblan finns kvar när man byter kapitel. */
  function aiBubbla(rubrik, text, klass, spara) {
    if (spara !== false) {

    }

  /* Skickar en fråga och håller samtalet levande. */
  async function skicka(fraga, etikett, behallMarkering) {
    if (arbetar || !fraga.trim()) return;
    visaFlik("ai");
    arbetar = true;
    skickaKnapp.disabled = true;

    var s = aktivtSamtal();
    var nyckel = samtalsnyckel();
    if (!s.visning.length) aiElement("ai-svar").textContent = "";

    aiBubbla(etikett || SPRAK.chatt.du_fragar, fraga, "fran-mig");
    var bubbla = ritaBubbla(null, SPRAK.chatt.tanker, "bubbla arbetar");

    // Nuläget skickas som färsk systemtext varje gång, så modellen
    // alltid ser den kod som ligger i rutan just nu.
    // I dev-läget är kursöversikten bara brus — där finns inga kapitel.
    var system = devlage
      ? lararroll() + "\n\n" + nulage()
      : lararroll() + "\n\n" + KURSEN + "\n\n" + nulage();
    s.meddelanden.push({ role: "user", content: fraga });
    if (s.meddelanden.length > 12) s.meddelanden = s.meddelanden.slice(-12);

    try {
      var svar = await fragaModellen(s.meddelanden, system);
      s.visning.push({ rubrik: null, text: svar, klass: "bubbla" });
      s.meddelanden.push({ role: "assistant", content: svar });
      if (samtalsnyckel() === nyckel) {
        bubbla.innerHTML = markdown(svar);
        bubbla.className = "bubbla";
      }
    } catch (e) {
      var fel = (e && e.message) || String(e);
      s.visning.push({ rubrik: null, text: fel, klass: "bubbla fel" });
      s.meddelanden.pop();
      if (samtalsnyckel() === nyckel) {
        bubbla.textContent = fel;
        bubbla.className = "bubbla fel";
      }
    } finally {
      arbetar = false;
      skickaKnapp.disabled = false;
      if (behallMarkering) aterstallMarkering();
      else fragaFalt.focus();
    }
  }

  /* Skriver ut en traceback där programmets egna rader går att klicka på. */
  function skrivFelmedLankar(text) {
    var ruta = document.createElement("span");
    ruta.className = "fel";
    var monster = /File "<program>", line (\d+)/g;
    var sist = 0, m;
    while ((m = monster.exec(text)) !== null) {
      ruta.appendChild(document.createTextNode(text.slice(sist, m.index)));
      var lank = document.createElement("button");
      lank.className = "radlank";
      lank.textContent = m[0];
      lank.title = SPRAK.ui.ga_till_raden;
      (function (nr) {
        lank.addEventListener("click", function () { gaTillRadnummer(nr); });
      })(parseInt(m[1], 10));
      ruta.appendChild(lank);
      sist = monster.lastIndex;
    }
    ruta.appendChild(document.createTextNode(text.slice(sist)));
    konsol.appendChild(ruta);
    konsol.scrollTop = konsol.scrollHeight;
  }

  function gaTillRadnummer(nr) {
    var rader = kodruta.value.split("\n");
    nr = Math.max(1, Math.min(nr, rader.length));
    var start = 0;
    for (var i = 0; i < nr - 1; i++) start += rader[i].length + 1;
    valjOchVisa(start, start + rader[nr - 1].length);
    kodruta.focus();
    markeraFelrad(nr);

  /* Plockar ut radnumret ur en traceback.

     Ramar från användarens eget program heter <program>. Vi letar efter
     dem först, så att interna rader ur Pyodide aldrig pekas ut som fel. */
  function radUrFel(feltext) {
    var egna = feltext.match(/File "<program>", line (\d+)/g);
    if (egna && egna.length) {
      return parseInt(egna[egna.length - 1].replace(/\D+/g, ""), 10);
    }
    var alla = feltext.match(/line (\d+)/g);
    if (!alla || !alla.length) return null;
    return parseInt(alla[alla.length - 1].replace("line ", ""), 10);
  }

  function kodutdrag(radnummer, marginal) {
    var rader = kodruta.value.split("\n");
    if (!radnummer || radnummer > rader.length) return null;
    var fran = Math.max(0, radnummer - marginal - 1);
    var till = Math.min(rader.length, radnummer + marginal);
    var ut = [];
    for (var i = fran; i < till; i++) {
      ut.push((i + 1 === radnummer ? ">> " : "   ") + (i + 1) + ": " + rader[i]);
    }
    return ut.join("\n");
  }

    if (utdrag) {

  kodruta.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      // Markerad kod körs i samma namnrymd som programmet, precis som
      // en rad i REPL:en. Utan markering körs hela filen.
      var vald = kodruta.value.slice(kodruta.selectionStart, kodruta.selectionEnd);
      if (vald.trim() && replKor) korMarkering(vald);
      else kor();
      return;
    }
    if (e.key.toLowerCase() === "s" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sparaFil(e.shiftKey); return; }
    if (e.key.toLowerCase() === "o" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); oppnaFil(); return; }
    if (e.key.toLowerCase() === "f" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); visaSok(false); return; }
    if (e.key.toLowerCase() === "h" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); visaSok(true); return; }
    if (e.key.toLowerCase() === "g" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); gaTillRad(); return; }
    if (e.key === "Escape" && !sokraden.hidden) { e.preventDefault(); doljSok(); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      var start = kodruta.selectionStart, slut = kodruta.selectionEnd, text = kodruta.value;
      if (e.shiftKey) {
        var radstart = text.lastIndexOf("\n", start - 1) + 1;
        if (text.substr(radstart, 4) === "    ") {
          kodruta.value = text.slice(0, radstart) + text.slice(radstart + 4);
          kodruta.selectionStart = kodruta.selectionEnd = Math.max(radstart, start - 4);
        }
      } else {
        kodruta.value = text.slice(0, start) + "    " + text.slice(slut);
        kodruta.selectionStart = kodruta.selectionEnd = start + 4;
      }
      markeraAndrad();
      return;
    }
    if (e.key === "Enter") {
      var pos = kodruta.selectionStart;
      var innan = kodruta.value.slice(0, pos);
      var rad = innan.slice(innan.lastIndexOf("\n") + 1);
      var indrag = (rad.match(/^\s*/) || [""])[0];
      if (/:\s*$/.test(rad)) indrag += "    ";
      if (indrag) {
        e.preventDefault();
        kodruta.value = innan + "\n" + indrag + kodruta.value.slice(kodruta.selectionEnd);
        kodruta.selectionStart = kodruta.selectionEnd = pos + 1 + indrag.length;
        markeraAndrad();
      }
    }
  });

  function paus(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* Medan koden kör låses allt som ändrar tillstånd eller lägger sig
     över skärmen. Kvar går att göra: stoppa, byta flik, svara på input()
     och röra kameran. Ett halvbytt tillstånd mitt i en körning är annars
     nästan omöjligt att förstå — både för användaren och för koden. */
  var LASTA = ["aterstall-kapitel", "oppna-knapp", "spara-knapp",
               "spara-som-knapp", "om-knapp", "felsakert-toggle", "ai-toggle",
               "ai-installningar-knapp", "ai-rensa-samtal", "ai-skicka", "ai-fraga",

    var app = document.getElementById("app-root");
    if (app) app.classList.toggle("kor-lage", las);
    if (!las) {
      // återta det som styrs av annan logik
      if (skickaKnapp) skickaKnapp.disabled = arbetar;
      uppdateraStoppKnapp();
    }
  }

  async function kor() {
    if (!pyodide) return;
    korKnapp.disabled = true;
    lasGranssnitt(true);
    rensaKonsol();
    visaFlik("utskrift");
    markeraSteg(0); await paus(140);
    markeraSteg(1); await paus(140);

    if (pyodide.loadPackagesFromImports) {
      try {
        statusEl.className = "status";

import ast

def _tomt(varde):
    """Sant om värdet inte är ett riktigt svar.

    JavaScript har två sorters tomhet, null och undefined, och Pyodide
    översätter dem olika. Vi litar därför inte på jämförelser mot None —
    ett riktigt svar är alltid en sträng, allt annat betyder avbrott.

import asyncio as _asyncio
import time as _time

_labb = {'varv': 0, 'start': 0.0, 'sist': 0.0, 'grans': 45.0}


def _labb_nollstall(grans=45.0):
    """Kallas före varje körning."""
    nu = _time.time()
    _labb.update({'varv': 0, 'start': nu, 'sist': nu, 'grans': grans})


async def _labb_vanta(loften):
    """Väntar på något som människan eller nätet styr över.

    Tiden som går här räknas inte mot tidsgränsen — annars skulle
    programmet avbrytas medan någon funderar på vad de ska skriva.
    """
    borjan = _time.time()
    try:
        return await loften
    finally:
        paus = _time.time() - borjan
        _labb['start'] += paus
        _labb['sist'] = _time.time()


async def _labb_kontroll():
    """Vakt som körs först i varje varv av varje loop.

    Nästan alla anrop returnerar direkt. Ungefär tjugo gånger i sekunden
    lämnas kontrollen tillbaka till webbläsaren, så att Stoppa-knappen
    hinner klickas och sidan hinner rita om.
    """
    _labb['varv'] += 1
    if _labb['varv'] & 63:
        return
    nu = _time.time()
    if nu - _labb['sist'] < 0.03:
        return
    _labb['sist'] = nu

    # Lämna kontrollen till webbläsaren FÖRST. Ett klick som kommer under
    # pausen hinner då sätta flaggan innan vi läser den här nedanför.
    await _asyncio.sleep(0)

    if js.window._labbStopp:
        raise KeyboardInterrupt(_T['stoppades'])
    gangna = _time.time() - _labb['start']
    if _labb['grans'] and gangna > _labb['grans']:
        raise TimeoutError(_T['tidsgrans'].replace('{sek}', '{:.0f}'.format(gangna)))


def _labb_generator(fnod):
    """Sant om funktionen innehåller yield — då är den en generator.

    Nästlade funktioner räknas inte: deras yield tillhör dem, inte oss.
    """
    ko = list(fnod.body)
    while ko:
        nod = ko.pop()
        if isinstance(nod, (ast.Yield, ast.YieldFrom)):
            return True
        if isinstance(nod, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Lambda)):
            continue
        ko.extend(ast.iter_child_nodes(nod))
    return False


def _labb_syntax(kallkod):
    """Kontrollerar syntaxen mot ANVÄNDARENS kod, före all omskrivning.

    Returnerar (rad, kolumn, meddelande) eller None. Radnumret gäller
    alltså exakt det som står i redigeraren.
    """
    try:
        ast.parse(kallkod)
        return None
    except SyntaxError as fel:
        return (fel.lineno or 1, fel.offset or 1, fel.msg)


ARBETSMAPP = '/home/pyodide/arbetsyta'


def _labb_arbetsfiler(poster):
    """Skriver användarens egna filer till Pythons filsystem.

    Mappen läggs först i sys.path, så att "import verktyg" hittar
    verktyg.py. Modulerna plockas bort ur cachen, annars skulle en
    ändrad fil inte märkas förrän sidan laddades om.
    """
    import importlib
    import os
    if not os.path.isdir(ARBETSMAPP):
        os.makedirs(ARBETSMAPP, exist_ok=True)
    if ARBETSMAPP not in _sys.path:
        _sys.path.insert(0, ARBETSMAPP)
    for namn, innehall in poster:
        with open(os.path.join(ARBETSMAPP, str(namn)), 'w') as f:
            f.write(str(innehall))
        modul = str(namn)[:-3] if str(namn).endswith('.py') else str(namn)
        _sys.modules.pop(modul, None)
    importlib.invalidate_caches()
    return len(poster)


async def _labb_repl(rad):
    """Kör en rad mot samma namnrymd som programmet.

    Först som uttryck, så att "x + 1" visar sitt värde. Går det inte
    körs raden som en sats i stället, så att tilldelningar fungerar.
    """
    import inspect
    rad = str(rad)
    try:
        kod = compile(rad, '<repl>', 'eval', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
    except SyntaxError:
        kod = compile(rad, '<repl>', 'exec', flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
        svar = eval(kod, globals())
        if inspect.isawaitable(svar):
            await svar
        return None
    svar = eval(kod, globals())
    if inspect.isawaitable(svar):
        svar = await svar
    return None if svar is None else repr(svar)


async def _labb_kor(kallkod, vakt=True):
    """Kör användarens kod.

    Trädet kompileras direkt i stället för att skrivas ut som text igen.
    Noderna bär med sig sina ursprungliga radnummer, så en traceback
    pekar på samma rad som användaren ser i redigeraren.
    """
    trad = _labb_trad(kallkod, vakt)
    if trad is None:
        trad = ast.parse(kallkod)
    kod = compile(trad, '<program>', 'exec',
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
    resultat = eval(kod, globals())
    if resultat is not None:
        await resultat


def _labb_antal_vakter(kallkod, vakt=True):
    """Hur många avbrottspunkter koden fick. Noll betyder att den
    inte kan stoppas."""
    trad = _labb_trad(kallkod, vakt)
    if trad is None:
        return 0
    return sum(1 for n in ast.walk(trad)
               if isinstance(n, ast.Name) and n.id == '_labb_kontroll')


def _labb_forbered(kallkod, vakt=True):
    """Skriver om koden innan den körs.

    Två saker händer: funktioner som väntar på något (input, nätverk)
    görs asynkrona, och varje loop får en vakt som gör att programmet
    kan avbrytas. Vakten hoppas över i prestandaläge.
    """
    trad = _labb_trad(kallkod, vakt)
    return kallkod if trad is None else ast.unparse(trad)


def _labb_trad(kallkod, vakt=True):
    """Bygger om koden till ett träd. None betyder att den inte gick att tolka."""
    try:
        trad = ast.parse(kallkod)
    except SyntaxError:
        return None

    if vakt:
        class Loopvakt(ast.NodeTransformer):
            """Lägger in ett anrop först i varje loopkropp.

            Generatorer hoppas över: ett await i en funktion med yield gör
            den till en asynkron generator, och en sådan går inte att
            loopa över med vanlig for.
            """

            def __init__(self):
                self.i_generator = 0

            def _funktion(self, nod):
                gen = _labb_generator(nod)
                if gen:
                    self.i_generator += 1
                self.generic_visit(nod)
                if gen:
                    self.i_generator -= 1
                return nod

            visit_FunctionDef = _funktion
            visit_AsyncFunctionDef = _funktion

            def _vakta(self, nod):
                self.generic_visit(nod)
                if self.i_generator:
                    return nod
                anrop = ast.Expr(value=ast.Call(
                    func=ast.Name(id='_labb_kontroll', ctx=ast.Load()),
                    args=[], keywords=[]))
                nod.body = [anrop] + nod.body
                return nod

            visit_While = _vakta
            visit_For = _vakta
            visit_AsyncFor = _vakta

        trad = ast.fix_missing_locations(Loopvakt().visit(trad))

    funktioner = {}

    def samla(nod, i_klass=False):
        # Metoder i klasser tas med: annars kan de aldrig bli asynkrona,
        # och en loop eller ett input() inuti en metod skulle ge syntaxfel.
        for barn in ast.iter_child_nodes(nod):
            if isinstance(barn, ast.ClassDef):
                samla(barn, True)
            elif isinstance(barn, ast.FunctionDef):
                # Generatorer lämnas som de är — de kan inte bli asynkrona
                # utan att sluta fungera med vanlig for.
                if not _labb_generator(barn):
                    funktioner[barn.name] = barn
                samla(barn, False)
            else:
                samla(barn, i_klass)

    samla(trad)

    def anropade_namn(nod):
        namn = set()
        for barn in ast.walk(nod):
            if isinstance(barn, ast.Call):
                if isinstance(barn.func, ast.Name):
                    namn.add(barn.func.id)
                elif isinstance(barn.func, ast.Attribute):
                    namn.add(barn.func.attr)
        return namn

    vantar = {'input', 'fetch_json', 'fetch_text', 'fetch_csv',
              'open_file', 'open_csv', 'open_json'}
    if vakt:
        vantar.add('_labb_kontroll')
    andrat = True
    while andrat:
        andrat = False
        for namn, nod in funktioner.items():
            if namn not in vantar and (anropade_namn(nod) & vantar):
                vantar.add(namn)
                andrat = True

    class Omvandlare(ast.NodeTransformer):
        def visit_FunctionDef(self, nod):
            self.generic_visit(nod)
            if nod.name in vantar and nod.name in funktioner:
                falt = {f: getattr(nod, f) for f in nod._fields}
                return ast.copy_location(ast.AsyncFunctionDef(**falt), nod)
            return nod

        def visit_Call(self, nod):
            self.generic_visit(nod)
            if isinstance(nod.func, ast.Name) and nod.func.id in vantar:
                return ast.copy_location(ast.Await(value=nod), nod)
            if isinstance(nod.func, ast.Attribute) and nod.func.attr in vantar:
                return ast.copy_location(ast.Await(value=nod), nod)
            return nod

    try:
        return ast.fix_missing_locations(Omvandlare().visit(trad))
    except Exception:
        return None

def _ljus_figur(figure):
    """Färgar om en figure till mörk text på vitt, så den syns som en sign."""
    MORK = '#1a2740'
    GRA = '#5b6b85'
    figure.patch.set_facecolor('white')
    for text in figure.texts:
        text.set_color(MORK)
    for panel in figure.axes:
        panel.set_facecolor('white')
        for edge in panel.spines.values():
            edge.set_color(GRA)
        panel.tick_params(colors=GRA)
        panel.xaxis.label.set_color(MORK)
        panel.yaxis.label.set_color(MORK)
        panel.title.set_color(MORK)
        for text in panel.texts:
            text.set_color(MORK)
        panel.grid(color='#dfe4ee')
        legend = panel.get_legend()
        if legend is not None:
            legend.get_frame().set_facecolor('white')
            legend.get_frame().set_edgecolor(GRA)
            for text in legend.get_texts():
                text.set_color(MORK)


def _diagram_till_bild(figure=None, width_px=2000, light=True):
    """Renderar en matplotlib-figure till en image som three.js kan använda."""
    import base64
    import io
    import matplotlib.pyplot as plt
    if figure is None:
        figure = plt.gcf()
    if light:
        _ljus_figur(figure)
    buffer = io.BytesIO()
    figure.savefig(buffer, format='png',
                  dpi=width_px / max(1.0, figure.get_figwidth()),
                  bbox_inches='tight', pad_inches=0.28,
                  facecolor=figure.get_facecolor())
    code = base64.b64encode(buffer.getvalue()).decode()
    return 'data:image/png;base64,' + code

def _i_polygon(lat, lon, polygon):
    """Ray casting: räknar hur många gånger en stråle korsar kanten."""
    inne = False
    n = len(polygon)
    j = n - 1
    for i in range(n):
        la_i, lo_i = polygon[i]
        la_j, lo_j = polygon[j]
        if (lo_i > lon) != (lo_j > lon):
            skarning = (la_j - la_i) * (lon - lo_i) / (lo_j - lo_i) + la_i
            if lat < skarning:
                inne = not inne
        j = i
    return inne


def _i_sverige(lat, lon, with_islands=True):
    """Ligger punkten innanför Sveriges kontur?"""
    if _i_polygon(lat, lon, SVERIGE):
        return True
    if with_islands:
        return _i_polygon(lat, lon, GOTLAND) or _i_polygon(lat, lon, OLAND)
    return False

<script>
/* Väljer språk och laddar rätt textfil innan motorn startar.
   ?lang=en i adressen vinner, annars sparat val, annars webbläsarens språk.

   En språkfil får vara ofullständig: saknade nycklar hämtas från
   basspråket. Det gör att en översättning kan växa fram stegvis utan
   att något i gränssnittet blir tomt. */
(function () {
  var SPRAKEN = ["sv", "en"];
  var BAS = "sv";

  /* Valet gjordes redan i dokumenthuvudet, innan sidan ritades. */
  function valt() {
    var p = window.PYTHONLAB_VALT;
    return SPRAKEN.indexOf(p) >= 0 ? p : BAS;
  }

  /* Fyller på med basspråkets texter där översättningen saknas.
     Listor vävs samman post för post — så kan kapitel 1-8 vara
     översatta medan resten faller tillbaka på basspråket. */
  function komplettera(bas, over) {
    if (bas === undefined || bas === null) return over;
    if (over === undefined || over === null) return bas;
    if (Array.isArray(bas) && Array.isArray(over)) {
      var lista = bas.slice();
      for (var i = 0; i < over.length; i++) {
        lista[i] = komplettera(bas[i], over[i]);
      }
      return lista;
    }
    if (Array.isArray(bas) || typeof bas !== "object") return over;
    var ut = {};
    Object.keys(bas).forEach(function (k) { ut[k] = bas[k]; });
    Object.keys(over).forEach(function (k) {
      ut[k] = (k in bas) ? komplettera(bas[k], over[k]) : over[k];
    });
    return ut;
  }

  function ladda(kod, klar, fel) {
    var s = document.createElement("script");
    // Versionen i adressen gör att webbläsaren hämtar om språkfilen när
    // labbet uppdaterats, i stället för att visa en gammal från cachen.
    // Frågetecken fungerar inte överallt på file://, så det hoppas över där.
    var stampel = (location.protocol === "file:" || !window.PYTHONLABBET_VERSION)
      ? "" : "?v=" + window.PYTHONLABBET_VERSION;
    s.src = "sprak-" + kod + ".js" + stampel;
    s.onload = function () {
      var spr = window.PYTHONLAB_SPRAK && window.PYTHONLAB_SPRAK[kod];
      spr ? klar(spr) : fel();
    };
    s.onerror = fel;
    document.head.appendChild(s);
  }

  function misslyckades(kod) {
    var r = document.getElementById("ladd-rubrik");
    var t = document.getElementById("ladd-text");
    if (r) r.textContent = "Language file missing";
    if (t) t.textContent = 'Could not load "sprak-' + kod + '.js". '
      + "Keep it in the same folder as this page.";
  }

  function starta(spr) {
    var kod = spr.html_lang || spr.kod || BAS;
    document.documentElement.lang = kod;
    var lokal = document.querySelector('meta[property="og:locale"]');
    if (lokal) lokal.setAttribute("content", kod === "sv" ? "sv_SE" : "en_US");
    window.PYTHONLAB_START(spr);
  }

  var kod = valt();
  ladda(BAS, function (bas) {
    if (kod === BAS) return starta(bas);
    ladda(kod, function (over) { starta(komplettera(bas, over)); },
          function () { starta(bas); });     // saknas översättningen: kör basspråket
  }, function () { misslyckades(BAS); });
})();
</script>
