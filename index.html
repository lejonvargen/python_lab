<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  /* ===== Versionen definieras HÄR och bara här. =====
     Höj sista siffran vid varje ny build. Allt annat följer automatiskt. */
  window.PYTHONLABBET_VERSION = "1.67";

  /* Språkvalet görs här uppe, innan sidan ritas. Webbläsaren avgör tidigt
     om den ska erbjuda översättning, och hinner den se svensk markup
     dyker förslaget upp även när det engelska paketet laddas. */
  window.PYTHONLAB_VALT = (function () {
    var p = (location.search.match(/[?&]lang=([a-z]{2})/i) || [])[1];
    if (p) p = p.toLowerCase();
    if (p !== "sv" && p !== "en") {
      try {
        var sparat = localStorage.getItem("pythonlab.sprak");
        if (sparat === "sv" || sparat === "en") p = sparat;
      } catch (e) { /* lagring kan vara avstängd */ }
    }
    if (p !== "sv" && p !== "en") {
      p = (navigator.language || "en").slice(0, 2).toLowerCase() === "sv" ? "sv" : "en";
    }
    document.documentElement.lang = p;
    return p;
  })();
</script>

<body>
<div id="app-root">
<div class="laddskarm" id="laddskarm">
  <div class="laddruta">
    <p class="laddmark"><span data-i18n="titel"></span> <span class="version" data-version></span></p>
    <p class="laddrubrik" id="ladd-rubrik" data-i18n="ladd.rubrik"></p>
    <div class="laddspar"><div class="laddfyll" id="ladd-fyll"></div></div>
    <p class="laddtext" id="ladd-text" data-i18n="ladd.text"></p>
    <p class="laddnot" data-i18n="ladd.not"></p>
  </div>
</div>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0e1c33; color: #e8f0ff;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }

  #app-root {
    --blueprint: #0e1c33;
    --panel: #142643;
    --panel-2: #1b3255;
    --line: rgba(140, 180, 255, 0.16);
    --chalk: #e8f0ff;
    --chalk-dim: #93a9cc;
    --amber: #ffc94a;
    --mint: #6ee7b7;
    --coral: #ff7d6b;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    background: var(--blueprint);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--chalk);
    font-family: var(--sans);
    height: 100dvh;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 0;
    position: relative;
  }
  #app-root * { box-sizing: border-box; }

  /* ---- laddningsskärm ---- */
  #app-root .laddskarm {
    position: absolute; inset: 0; z-index: 60;
    background: rgba(14, 28, 51, 0.97);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; transition: opacity .35s ease;
  }
  #app-root .laddskarm.klar { opacity: 0; pointer-events: none; }
  #app-root .laddskarm[hidden] { display: none; }
  #app-root .laddruta { width: 100%; max-width: 430px; text-align: left; }
  #app-root .laddmark {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--amber); margin: 0 0 18px;
  }
  #app-root .laddrubrik { font-size: 17px; color: var(--chalk); margin: 0 0 12px; }
  #app-root .laddspar {
    height: 6px; border-radius: 999px; background: var(--panel-2);
    border: 1px solid var(--line); overflow: hidden;
  }
  #app-root .laddfyll {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--amber), var(--mint));
    transition: width .35s ease;
  }
  #app-root .laddfyll.obestamd {
    width: 35%;
    animation: glid 1.4s ease-in-out infinite;
  }
  @keyframes glid {
    0% { margin-left: -35%; } 100% { margin-left: 100%; }
  }
  #app-root .laddtext {
    font-family: var(--mono); font-size: 11.5px; color: var(--chalk-dim);
    margin: 10px 0 0; min-height: 16px;
  }
  #app-root .laddnot {
    font-size: 12.5px; color: var(--chalk-dim); line-height: 1.55; margin: 20px 0 0;
  }
  #app-root .laddskarm.trasig .laddfyll { background: var(--coral); animation: none; width: 100%; }
  @media (prefers-reduced-motion: reduce) {
    #app-root .laddfyll, #app-root .laddskarm { transition: none; }
    #app-root .laddfyll.obestamd { animation: none; width: 100%; opacity: .4; }
  }

  #app-root .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 18px; border-bottom: 1px solid var(--line);
    background: rgba(14, 28, 51, 0.85); flex: 0 0 auto;
  }
  #app-root .wordmark { margin: 0; font-weight: 400;
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--amber);
  }
  #app-root .startversion {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--chalk-dim); margin: 0 0 16px;
  }
  #app-root .version {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    color: var(--chalk-dim); text-transform: none; margin-left: 9px;
  }
  #app-root .omlank {
    /* Samma sättning som strömbrytarnas etiketter till vänster. */
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--chalk-dim);
    background: transparent; border: 0; padding: 0;
    margin-left: 10px; cursor: pointer; line-height: inherit;
    align-self: center;
    text-decoration: underline; text-underline-offset: 3px;
    text-decoration-color: rgba(147, 169, 204, 0.35);
  }
  #app-root .omlank:hover {
    color: var(--amber); text-decoration-color: var(--amber);
  }
  #app-root .omlank:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  #app-root .strombrytare {
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; margin-left: 4px;
  }
  #app-root .strombrytare input { position: absolute; opacity: 0; width: 0; height: 0; }
  #app-root .spar-toggle {
    width: 34px; height: 18px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    display: inline-block; position: relative; transition: background .15s ease, border-color .15s ease;
  }
  #app-root .spar-toggle .knopp {
    position: absolute; top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--chalk-dim); transition: transform .15s ease, background .15s ease;
  }
  #app-root .strombrytare input:checked + .spar-toggle {
    background: rgba(255, 201, 74, .25); border-color: var(--amber);
  }
  #app-root .strombrytare input:checked + .spar-toggle .knopp {
    transform: translateX(16px); background: var(--amber);
  }
  #app-root .strombrytare input:focus-visible + .spar-toggle { outline: 2px solid var(--amber); outline-offset: 2px; }
  #app-root .toggle-text {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--chalk-dim);
  }
  #app-root .strombrytare input:checked ~ .toggle-text { color: var(--amber); }
  #app-root .status {
    margin-left: auto; font-family: var(--mono); font-size: 11.5px;
    letter-spacing: 0.08em; color: var(--chalk-dim);
    display: flex; align-items: center; gap: 8px;
  }
  #app-root .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  #app-root .status.klar .dot { background: var(--mint); animation: none; }
  #app-root .status.trasig .dot { background: var(--coral); animation: none; }
  @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

  #app-root .layout { flex: 1 1 auto; display: grid; grid-template-columns: 248px 1fr; min-height: 0; }

  #app-root .rail {
    border-right: 1px solid var(--line); padding: 14px 12px 24px;
    overflow-y: auto; background: rgba(20, 38, 67, 0.55);
  }
  #app-root .rubrik {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--chalk-dim); margin: 0 0 9px 4px;
  }
  #app-root .delrubrik {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--amber); opacity: .75;
    margin: 16px 0 6px 4px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  #app-root .delrubrik.forst { margin-top: 4px; border-top: 0; padding-top: 0; }
  #app-root .lektion {
    width: 100%; text-align: left; background: transparent;
    border: 1px solid transparent; border-radius: 8px; color: var(--chalk);
    padding: 7px 10px; margin-bottom: 2px; cursor: pointer;
    font-family: var(--sans); font-size: 13.5px;
    display: flex; gap: 9px; align-items: baseline;
    transition: background .12s ease, border-color .12s ease;
  }
  #app-root .lektion:hover { background: var(--panel-2); }
  #app-root .lektion.vald { border-color: var(--amber); background: var(--panel-2); }
  #app-root .lektion .nr { font-family: var(--mono); font-size: 11px; color: var(--amber); flex: 0 0 auto; }
  #app-root .tomt { font-size: 12.5px; color: var(--chalk-dim); padding: 2px 6px; line-height: 1.5; }

  #app-root .arbetsyta { display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 0.95fr); min-height: 0; }
  #app-root .redigerare { display: flex; flex-direction: column; min-height: 0; }
  #app-root .verktyg {
    display: flex; align-items: center; gap: 7px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  #app-root .filnamn { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); margin-right: auto; }
  #app-root .filnamn .andrad { color: var(--amber); }
  #app-root button.knapp {
    font-family: var(--sans); font-size: 13px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--chalk);
    padding: 6px 12px; cursor: pointer; transition: transform .08s ease, background .12s ease;
  }
  #app-root button.knapp:hover { background: #234070; }
  #app-root button.knapp:active { transform: translateY(1px); }
  #app-root button.kor { background: var(--amber); border-color: var(--amber); color: #2a1a00; font-weight: 650; }
  #app-root button.kor:hover { background: #ffd772; }
  #app-root button.kor:disabled { opacity: .45; cursor: wait; }
  #app-root button.stoppa {
    background: var(--coral); border-color: var(--coral);
    color: #2a0a05; font-weight: 650;
  }
  #app-root button.stoppa:hover { background: #ff9686; }
  #app-root.kor-lage .lektion:disabled,
  #app-root.kor-lage .verktyg .knapp:disabled,
  #app-root.kor-lage .strombrytare:has(input:disabled),
  #app-root.kor-lage .omlank:disabled,
  #app-root.kor-lage .ai-chip:disabled {
    opacity: .38;
    cursor: not-allowed;
  }
  #app-root.kor-lage .strombrytare:has(input:disabled) { pointer-events: none; }
  #app-root button.stoppa:disabled {
    background: transparent; border-color: var(--line);
    color: var(--chalk-dim); cursor: default;
  }

  #app-root textarea {
    flex: 1 1 auto; width: 100%; resize: none; border: 0; outline: none;
    background: transparent; color: var(--chalk); font-family: var(--mono);
    font-size: 14.5px; line-height: 1.65; padding: 14px 16px; tab-size: 4;
  }

  /* ---- radnummer ----
     Spalten måste ha exakt samma teckenstorlek, radhöjd och övre
     marginal som textrutan, annars glider siffrorna isär från koden. */
  #app-root .kodyta {
    flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden;
  }
  /* ---- syntaxfärgning ----
     Den färgade texten ligger i ett lager under textrutan. Textrutan
     görs genomskinlig men behåller sin markör och sin markering, så
     redigeringen fungerar precis som förut. Måtten MÅSTE vara identiska,
     annars glider lagren isär tecken för tecken. */
  /* Uppgiften ligger längst ner i kapiteltexten, som inte syns när man
     kodar. Den här raden håller den framme utan att ta plats. */
  #app-root .uppgiftsrad {
    border-bottom: 1px solid var(--line);
    background: rgba(255, 201, 74, .07);
    font-size: 13px; line-height: 1.55;
  }
  #app-root .uppgiftsrad[hidden] { display: none; }
  #app-root .uppgiftsrad > summary {
    cursor: pointer; list-style: none; padding: 7px 14px;
    color: var(--amber); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #app-root .uppgiftsrad > summary::-webkit-details-marker { display: none; }
  #app-root .uppgiftsrad > summary::before { content: "▸ "; }
  #app-root .uppgiftsrad[open] > summary::before { content: "▾ "; }
  #app-root #uppgiftstext {
    padding: 0 14px 12px; color: var(--chalk);
    max-height: 32vh; overflow-y: auto;
  }
  #app-root #uppgiftstext code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--panel-2); border-radius: 4px; padding: 1px 5px;
  }
  #app-root.dev-lage .uppgiftsrad { display: none; }

  #app-root .sokrad {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  #app-root .sokrad[hidden] { display: none; }
  #app-root .sokrad input {
    background: var(--blueprint); border: 1px solid var(--line);
    border-radius: 6px; color: var(--chalk); font-family: var(--mono);
    font-size: 12.5px; padding: 5px 8px; outline: none; min-width: 0;
  }
  #app-root .sokrad input:focus { border-color: var(--amber); }
  #app-root #sokfalt { flex: 1 1 140px; }
  #app-root #ersattfalt { flex: 1 1 140px; }
  #app-root .sokrad:not(.med-ersatt) #ersattfalt,
  #app-root .sokrad:not(.med-ersatt) #sok-ersatt,
  #app-root .sokrad:not(.med-ersatt) #sok-ersatt-alla { display: none; }
  #app-root .minik {
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    color: var(--chalk-dim); font-family: var(--sans); font-size: 12px;
    padding: 4px 9px; cursor: pointer;
  }
  #app-root .minik:hover { color: var(--amber); border-color: var(--amber); }
  #app-root .minik.stang { margin-left: auto; border: 0; font-size: 15px; }
  #app-root .radlank {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: inherit; font: inherit;
    text-decoration: underline; text-underline-offset: 2px;
    text-decoration-style: dotted;
  }
  #app-root .radlank:hover { color: var(--amber); text-decoration-style: solid; }
  #app-root .soktraffar {
    font-family: var(--mono); font-size: 11.5px; color: var(--chalk-dim);
    min-width: 46px;
  }

  #app-root .skrivyta { position: relative; flex: 1 1 auto; min-width: 0; }
  #app-root .traffar,
  #app-root .kodfarg,
  #app-root .skrivyta textarea {
    position: absolute; inset: 0; margin: 0;
    font-family: var(--mono); font-size: 14.5px; line-height: 1.65;
    padding: 14px 16px 14px 10px; tab-size: 4;
    white-space: pre; overflow: auto; border: 0;
    letter-spacing: normal; word-spacing: normal;
  }
  #app-root .kodfarg {
    pointer-events: none; color: var(--chalk-dim);
    overflow: hidden; background: transparent;
  }
  /* Träfflagret målar bara bakgrunder. Texten är osynlig, färgerna
     ligger ovanpå, och textrutan högst upp. */
  #app-root .traffar {
    pointer-events: none; color: transparent;
    overflow: hidden; background: transparent;
  }
  /* Konturer, inte fyllning. En ifylld markering ljusnar bakgrunden och
     äter upp kontrasten för de dämpade färgerna — kommentarer ligger
     redan lågt och blir oläsliga. En kontur syns lika bra och lämnar
     textens läsbarhet exakt som den var. */
  #app-root .traffar .traff {
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(143, 180, 255, .75);
  }
  #app-root .traffar .traff.aktiv {
    box-shadow: inset 0 0 0 2px var(--amber), 0 0 6px rgba(255, 201, 74, .45);
  }
  #app-root .skrivyta textarea {
    color: transparent; caret-color: var(--chalk);
    background: transparent; resize: none; outline: none; width: 100%;
  }
  #app-root .skrivyta textarea::selection { background: rgba(255, 201, 74, 0.3); }

  #app-root .kodfarg .nyckel   { color: #ff9ecb; }
  #app-root .kodfarg .inbyggd  { color: #8fb4ff; }
  #app-root .kodfarg .strang   { color: #6ee7b7; }
  #app-root .kodfarg .tal      { color: #ffc94a; }
  #app-root .kodfarg .komm     { color: #6b7f9e; font-style: italic; }
  #app-root .kodfarg .namn     { color: #ffd9a0; }   /* funktionsnamn */
  #app-root .kodfarg .dekor    { color: #c98bff; }
  #app-root .kodfarg .vanlig   { color: var(--chalk); }  /* variabler */
  /* ---- dev-läge: ett vyfilter, inget annat ----
     Kapitlen finns kvar i minnet och kommer tillbaka orörda när man
     växlar tillbaka. Här döljs bara det som hör kursen till. */
  #app-root.dev-lage #lektionslista,
  #app-root.dev-lage #kapitel-rubrik,
  #app-root.dev-lage #start-knapp,
  #app-root.dev-lage #flik-lektion,
  #app-root.dev-lage #spar { display: none; }

  /* Stegraden är rutnätets mittersta rad. Döljs den finns bara två
     objekt kvar, och den nedre panelen skulle ärva "auto" — alltså växa
     med sitt innehåll och klämma ihop kodrutan. Därför tas raden bort
     ur mallen samtidigt. */
  #app-root.dev-lage .arbetsyta {
    grid-template-rows: minmax(0, 1fr) minmax(0, 0.95fr);
  }
  #app-root.dev-lage #fillista { margin-top: 4px; }
  /* Nytt är borttaget: Återställ lägger tillbaka originalet i ett
     kapitel, Rensa fil tömmer en fil utan original.

     Öppna fil pekar inåt — den läser in något utifrån i arbetsytan.
     Det behovet finns i utvecklarläget, inte mitt i en kurs där allt
     redan sparas automatiskt. Spara pekar utåt och behövs i båda. */
  #app-root:not(.dev-lage) #oppna-knapp { display: none; }

  #app-root .replrad {
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--line); padding: 8px 16px;
    background: rgba(0, 0, 0, .13);
  }
  #app-root .replrad[hidden] { display: none; }
  #app-root .replprompt {
    font-family: var(--mono); font-size: 13.5px; color: var(--mint);
    user-select: none;
  }
  #app-root #repl {
    flex: 1 1 auto; background: transparent; border: 0; outline: none;
    color: var(--chalk); font-family: var(--mono); font-size: 13.5px;
    padding: 2px 0;
  }
  #app-root #repl::placeholder { color: var(--chalk-dim); opacity: .6; }
  #app-root .minifil {
    width: 100%; margin-top: 6px; font-size: 12px; padding: 5px 10px;
    justify-content: center;
  }
  #app-root .filrad {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: 0; cursor: pointer; text-align: left;
    color: var(--chalk-dim); font-family: var(--mono); font-size: 12.5px;

<script>
window.PYTHONLAB_START = function (SPRAK) {
  "use strict";

  /* ---- fyll gränssnittet med det valda språkets texter ----
     Måste ske innan motorn hämtar sina elementreferenser. */
  (function () {
    function slaUpp(vag) {
      return vag.split(".").reduce(function (o, del) {
        return (o && o[del] !== undefined) ? o[del] : null;
      }, SPRAK);
    }
    var saknade = [];
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      var vag = el.getAttribute("data-i18n");
      var text = slaUpp(vag);
      if (text !== null) {
        el.textContent = text;
      } else if (!el.textContent.trim()) {
        // Hellre nyckelns namn än en tom yta — då syns det att språkfilen
        // är för gammal i stället för att knappen bara försvinner.
        el.textContent = vag.split(".").pop();
        saknade.push(vag);
      }
    });
    [["data-i18n-title", "title"], ["data-i18n-placeholder", "placeholder"]]
      .forEach(function (par) {
        Array.prototype.forEach.call(document.querySelectorAll("[" + par[0] + "]"), function (el) {
          var text = slaUpp(el.getAttribute(par[0]));
          if (text !== null) el.setAttribute(par[1], text);
        });
      });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-html]"), function (el) {
      var text = slaUpp(el.getAttribute("data-i18n-html"));
      if (text !== null) el.innerHTML = text;
    });
    if (saknade.length && window.console) {
      console.warn("Language file is missing " + saknade.length + " strings: "
        + saknade.join(", ") + ". Reload the page with Ctrl+F5.");
    }
    function fyllHtml(id, html) {
      var el = document.getElementById(id);
      if (el && html) el.innerHTML = html;
    }
    fyllHtml("om-dialog", SPRAK.om);
    fyllHtml("ai-dialog", SPRAK.ai_dialog);
    fyllHtml("lektionstext", SPRAK.start);
    if (SPRAK.titel) {
      document.title = SPRAK.titel + " (ver " + (window.PYTHONLABBET_VERSION || "?") + ")";
      var og = document.querySelector('meta[property="og:title"]');
      if (og) og.setAttribute("content", document.title);
      var be = document.querySelector('meta[name="description"]');
      if (be && SPRAK.beskrivning) be.setAttribute("content", SPRAK.beskrivning);
    }
  })();

  /* ---- versionen skrivs in överallt den efterfrågas ---- */
  var VERSION = window.PYTHONLABBET_VERSION || "?";
  document.title = SPRAK.titel || "Pytho";
  var ogTitel = document.querySelector('meta[property="og:title"]');
  if (ogTitel) ogTitel.setAttribute("content", document.title);
  Array.prototype.forEach.call(document.querySelectorAll("[data-version]"), function (el) {
    el.textContent = el.classList.contains("dialog-ingress")
      ? "Version " + VERSION
      : "ver " + VERSION;
  });

  var kodruta = document.getElementById("kod");
  var konsol = document.getElementById("konsol");
  var korKnapp = document.getElementById("kor-knapp");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var filnamnEl = document.getElementById("filnamn");
  var sparEl = document.getElementById("spar");
  var lektionstext = document.getElementById("lektionstext");
  var startKnapp = document.getElementById("start-knapp");
  var aterstallKapitelKnapp = document.getElementById("aterstall-kapitel");
  var panelLektion = document.getElementById("panel-lektion");
  var panelUtskrift = document.getElementById("panel-utskrift");
  var flikLektion = document.getElementById("flik-lektion");
  var flikUtskrift = document.getElementById("flik-utskrift");
  var flikScen = document.getElementById("flik-scen");
  var panelScen = document.getElementById("panel-scen");
  var scenruta = document.getElementById("scenruta");
  var helskarmKnapp = document.getElementById("helskarm-knapp");
  var aterstallKnapp = document.getElementById("aterstall-knapp");
  var rensaKnapp = document.getElementById("rensa-knapp");
  var stoppaKnapp = document.getElementById("stoppa-knapp");
  var felsakertToggle = document.getElementById("felsakert-toggle");
  var flikAi = document.getElementById("flik-ai");
  var panelAi = document.getElementById("panel-ai");
  var aiToggle = document.getElementById("ai-toggle");
  var filvaljare = document.getElementById("filvaljare");
  var redigerare = document.getElementById("redigerare");

  var pyodide = null;
  var forberedKod = null;
  var nollstallVakt = null;
  var syntaxkoll = null;
  var korProgram = null;
  var raknaVakter = null;
  var skrivArbetsfiler = null;
  var replKor = null;
  var filhandtag = null;
  var filnamn = SPRAK.ui.nytt_filnamn || "nytt_program.py";
  var andrad = false;

  /* =======================================================
     KAPITEL
     ======================================================= */
  var LEKTIONER = SPRAK.kapitel;

  var STARTKOD = SPRAK.startkod.join("\n");

  /* =======================================================
     Utskrift och flikar
     ======================================================= */
  function skriv(text, klass) {
    var rad = document.createElement("span");
    rad.className = klass || "ut";
    rad.textContent = text;
    konsol.appendChild(rad);
    konsol.scrollTop = konsol.scrollHeight;
  }
  function rensaKonsol() { konsol.textContent = ""; }

  /* Frågar användaren direkt i konsolen i stället för i en popup. */
  function fragaIKonsolen(text) {
    return new Promise(function (svara) {
      visaFlik("utskrift");
      var rad = document.createElement("div");
      rad.className = "fraga";
      var etikett = document.createElement("span");
      etikett.className = "ut";
      etikett.textContent = text;
      var falt = document.createElement("input");
      falt.className = "svarsfalt";
      falt.type = "text";
      falt.setAttribute("autocomplete", "off");
      rad.appendChild(etikett);
      rad.appendChild(falt);
      konsol.appendChild(rad);
      konsol.scrollTop = konsol.scrollHeight;
      falt.focus();

      var slutfor = registreraVantan(function () { klar(undefined); });

      function klar(varde) {
        slutfor();
        if (!rad.contains(falt)) return;      // redan besvarad
        rad.removeChild(falt);
        var eko = document.createElement("span");
        eko.className = "svar";
        eko.textContent = (typeof varde === "string" ? varde : "^C") + "\n";
        rad.appendChild(eko);
        konsol.scrollTop = konsol.scrollHeight;
        svara(varde);
      }

      falt.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); klar(String(falt.value)); }
        else if (e.key === "Escape") { e.preventDefault(); klar(undefined); }
      });
    });
  }
  window._labbFraga = fragaIKonsolen;

  /* Sätts av Stoppa-knappen och läses av loopvakten i Python. */
  window._labbStopp = false;

  /* ---- register över saker programmet väntar på ----
     Under input(), en filväljare eller en nätverkshämtning står Python
     stilla och webbläsaren är ledig. Då finns ingen loop att vakta i,
     men väntan går ändå att avbryta — den som väntar lämnar in en
     funktion här, och Stoppa-knappen anropar alla på en gång. */
  var vantande = [];

  function registreraVantan(avbryt) {
    vantande.push(avbryt);
    uppdateraStoppKnapp();
    return function klart() {
      var i = vantande.indexOf(avbryt);
      if (i >= 0) vantande.splice(i, 1);
      uppdateraStoppKnapp();
    };
  }

  function avbrytAllVantan() {
    var kopia = vantande.slice();
    vantande.length = 0;
    kopia.forEach(function (f) { try { f(); } catch (e) { /* redan klar */ } });
    uppdateraStoppKnapp();
  }

  /* Ger Python en avbrytbar hämtning: signalen skickas till fetch, och
     Stoppa-knappen kan avbryta den mitt i. */
  window._labbStyrning = function () {
    var styr = new AbortController();
    var klart = registreraVantan(function () { styr.abort(); });
    return { signal: styr.signal, klar: klart };
  };

  /* Låter Python-kod be användaren peka ut en fil från datorn. */
  window._labbValjFil = function (filter) {
    return new Promise(function (klar) {
      var valjare = document.createElement("input");
      valjare.type = "file";
      if (filter) valjare.accept = filter;
      valjare.style.display = "none";
      document.body.appendChild(valjare);

      var avslutad = false;
      var slutfor = registreraVantan(function () { stad(undefined); });
      function stad(resultat) {
        if (avslutad) return;
        avslutad = true;
        slutfor();
        if (valjare.parentNode) document.body.removeChild(valjare);
        klar(resultat);
      }

      valjare.addEventListener("change", function () {
        var fil = valjare.files && valjare.files[0];
        if (!fil) return stad(undefined);
        var lasare = new FileReader();
        lasare.onload = function () {
          stad({ namn: fil.name, innehall: String(lasare.result) });
        };
        lasare.onerror = function () { stad(undefined); };
        lasare.readAsText(fil);
      });

      // Om användaren avbryter dialogen kommer ingen change-händelse.
      window.addEventListener("focus", function avbrutet() {
        window.removeEventListener("focus", avbrutet);
        setTimeout(function () {
          if (!valjare.files || !valjare.files.length) stad(undefined);
        }, 900);
      });

      valjare.click();
    });
  };

  /* Låter Python-kod ladda ner en fil till datorn. */
  window._labbLaddaNer = function (namn, innehall) {
    var blob = new Blob([innehall], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var lank = document.createElement("a");
    lank.href = url;
    lank.download = namn;
    document.body.appendChild(lank);
    lank.click();
    document.body.removeChild(lank);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  };

  /* Tar emot diagram från matplotlib och visar dem i utskriften. */
  window._labbBild = function (dataurl) {
    visaFlik("utskrift");
    var bild = document.createElement("img");
    bild.className = "diagram";
    bild.src = dataurl;
    konsol.appendChild(bild);
    konsol.scrollTop = konsol.scrollHeight;
  };

  function visaFlik(vilken) {
    var paneler = {
      lektion: [panelLektion, flikLektion],
      utskrift: [panelUtskrift, flikUtskrift],
      scen: [panelScen, flikScen],
      ai: [panelAi, flikAi]
    };
    Object.keys(paneler).forEach(function (namn) {
      paneler[namn][0].hidden = namn !== vilken;
      paneler[namn][1].classList.toggle("vald", namn === vilken);
    });
    // Knapparnas synlighet sätts FÖRE allt som kan misslyckas.
    sattKnappsynlighet(vilken === "scen");
    if (vilken === "scen") {
      try { anpassaStorlek(); } catch (e) { /* scenen kanske inte är byggd än */ }
    }
  }

  /* Knappen visas när det finns något att avbryta: antingen loopar med
     vakt, eller en väntan på input, fil eller nätverk. Väntan går att
     avbryta även när felsäkert läge är av. */
  var korning = { igang: false, vakter: 0 };

  function uppdateraStoppKnapp() {
    var vantar = vantande.length > 0;
    var kanStoppas = (korning.igang && korning.vakter > 0) || vantar;
    stoppaKnapp.hidden = !(korning.igang || vantar);
    stoppaKnapp.disabled = !kanStoppas || window._labbStopp;
    if (!window._labbStopp) {
      stoppaKnapp.textContent = SPRAK.ui.stoppa;
      stoppaKnapp.title = kanStoppas
        ? (vantar ? SPRAK.ord.stopp_vantan : SPRAK.ord.stopp_loop)
        : SPRAK.ord.stopp_inget;
    }
  }

  function sattKnappsynlighet(scenAktiv) {
    helskarmKnapp.hidden = !scenAktiv;
    helskarmKnapp.style.display = scenAktiv ? "" : "none";
    aterstallKnapp.hidden = !scenAktiv;
    aterstallKnapp.style.display = scenAktiv ? "" : "none";
    rensaKnapp.hidden = !!scenAktiv;
    rensaKnapp.style.display = scenAktiv ? "none" : "";
  }
  document.getElementById("helskarm-knapp").addEventListener("click", function () { helskarm(); });
  aterstallKnapp.addEventListener("click", function () { aterstallVy(); });
  flikAi.addEventListener("click", function () { visaFlik("ai"); });
  flikLektion.addEventListener("click", function () { visaFlik("lektion"); });
  flikUtskrift.addEventListener("click", function () { visaFlik("utskrift"); });
  flikScen.addEventListener("click", function () { visaFlik("scen"); });

  /* =======================================================
     3D-scen via three.js
     ======================================================= */
  var THREE_KALLOR = [
    "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
  ];
  var tre = { laddad: false, scen: null, kamera: null, renderare: null, objekt: [], bildruta: null, callback: null, tid: 0 };

  async function laddaThree() {
    if (window.THREE) { tre.laddad = true; return true; }
    for (var i = 0; i < THREE_KALLOR.length; i++) {
      try {
        await medTidsgrans(laddaSkript(THREE_KALLOR[i]), 20000, "three.js");
        if (window.THREE) { tre.laddad = true; return true; }
      } catch (e) { /* prova nästa */ }
    }
    return false;
  }

  /* Finns WebGL i den här webbläsaren? Svaret ändras inte under
     sessionen, så det räknas ut en gång. Saknas det beror det oftast på
     avstängd hårdvaruacceleration eller ett gammalt grafikkort — inget
     som koden kan göra något åt, men det ska sägas begripligt. */
  var webglSvar = null;
  function harWebGL() {
    if (webglSvar !== null) return webglSvar;
    try {
      var duk = document.createElement("canvas");
      webglSvar = !!(window.WebGLRenderingContext &&
        (duk.getContext("webgl2") || duk.getContext("webgl") ||
         duk.getContext("experimental-webgl")));
    } catch (e) {
      webglSvar = false;
    }
    return webglSvar;
  }

  function anpassaStorlek() {
    if (!tre.renderare) return;
    var b = scenruta.clientWidth || 600;
    var h = scenruta.clientHeight || 300;
    tre.renderare.setSize(b, h);
    tre.kamera.aspect = b / h;
    tre.kamera.updateProjectionMatrix();
  }
  window.addEventListener("resize", anpassaStorlek);
  document.addEventListener("fullscreenchange", function () {
    var i_helskarm = !!document.fullscreenElement;
    panelScen.hidden = false;
    flikScen.classList.add("vald");
    sattKnappsynlighet(true);
    helskarmKnapp.textContent = i_helskarm ? SPRAK.ord.avsluta_helskarm : SPRAK.ord.helskarm;
    if (!i_helskarm) {
      panelLektion.hidden = true;
      panelUtskrift.hidden = true;
      panelAi.hidden = true;
      flikLektion.classList.remove("vald");
      flikUtskrift.classList.remove("vald");
      flikAi.classList.remove("vald");
    }
    setTimeout(function () { try { anpassaStorlek(); } catch (e) {} }, 60);
    setTimeout(function () { try { anpassaStorlek(); } catch (e) {} }, 350);
  });

  /* ---- kamerastyrning med musen ---- */
  /* ---- kameran ----
     Kameran har en position i världen och en blickriktning. Att dra med
     musen vrider blicken kring kamerans egen position, så man kan vända
     sig om på stället. Piltangenterna flyttar positionen. */
  var bana = {
    pos: { x: 0, y: 5, z: 12 },   // var kameran står
    theta: 0,                     // vridning i sidled, radianer
    phi: Math.PI / 2,             // lutning: pi/2 är rakt fram, mindre är nedåt
    skala: 12,                    // scenens storlek, styr steglängd
    aktiv: false, x: 0, y: 0
  };
  var STARTBANA = { pos: { x: 0, y: 5, z: 12 }, theta: 0, phi: Math.PI / 2, skala: 12 };

  /* Enhetsvektor i den riktning kameran tittar. */
  function blickriktning() {
    var p = bana.phi, t = bana.theta;
    return {
      x: Math.sin(p) * Math.sin(t),
      y: Math.cos(p),
      z: Math.sin(p) * Math.cos(t)
    };
  }

  function placeraKamera() {
    if (!tre.kamera) return;
    bana.phi = Math.max(0.06, Math.min(Math.PI - 0.06, bana.phi));
    var r = blickriktning();
    tre.kamera.position.set(bana.pos.x, bana.pos.y, bana.pos.z);
    tre.kamera.lookAt(bana.pos.x + r.x, bana.pos.y + r.y, bana.pos.z + r.z);
  }

  /* Ställer kameran på en punkt och riktar blicken mot en annan. */
  function sikta(fran, mot) {
    var dx = mot.x - fran.x, dy = mot.y - fran.y, dz = mot.z - fran.z;
    var d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    bana.pos = { x: fran.x, y: fran.y, z: fran.z };
    bana.phi = Math.acos(Math.max(-1, Math.min(1, dy / d)));
    bana.theta = Math.atan2(dx, dz);
    bana.skala = d;
    placeraKamera();
  }

  function sparaStartlage() {
    STARTBANA = {
      pos: { x: bana.pos.x, y: bana.pos.y, z: bana.pos.z },
      theta: bana.theta, phi: bana.phi, skala: bana.skala
    };
  }

  /* ---- förflyttning ---- */
  var tangenter = {};
  var fart = { framat: 0, isidled: 0, upp: 0 };

  var PILAR = {
    ArrowUp:    ["framat", 1],
    ArrowDown:  ["framat", -1],
    ArrowLeft:  ["isidled", -1],
    ArrowRight: ["isidled", 1],
    PageUp:     ["upp", 1],
    PageDown:   ["upp", -1]
  };

  function onskadFart(axel) {
    var summa = 0;
    Object.keys(tangenter).forEach(function (tangent) {
      var p = PILAR[tangent];
      if (p && p[0] === axel) summa += p[1];
    });
    return Math.max(-1, Math.min(1, summa));
  }

  /* Flyttar kameran som en drönare: framåt dit blicken pekar, sidled
     vågrätt, och Page Up/Down rakt upp och ner. */
  function flytta(framat, isidled, upp, langd) {
    var r = blickriktning();
    // Höger = blickriktningen korsad med världens uppåt, hållen vågrät.
    var hx = -Math.cos(bana.theta), hz = Math.sin(bana.theta);
    bana.pos.x += (r.x * framat + hx * isidled) * langd;
    bana.pos.y += (r.y * framat + upp) * langd;
    bana.pos.z += (r.z * framat + hz * isidled) * langd;
    placeraKamera();
  }

  function uppdateraForflyttning(dt) {
    var MJUKHET = 7;                    // högre = snabbare respons
    var andel = Math.min(1, MJUKHET * dt);
    var rorelse = false;
    ["framat", "isidled", "upp"].forEach(function (axel) {
      fart[axel] += (onskadFart(axel) - fart[axel]) * andel;
      if (Math.abs(fart[axel]) < 0.001) fart[axel] = 0;
      else rorelse = true;
    });
    if (!rorelse) return;
    var steg = Math.max(0.35, bana.skala * 0.07) * 9 * dt;
    flytta(fart.framat, fart.isidled, fart.upp, steg);
  }

  function aterstallVy() {
    bana.pos = { x: STARTBANA.pos.x, y: STARTBANA.pos.y, z: STARTBANA.pos.z };
    bana.theta = STARTBANA.theta;
    bana.phi = STARTBANA.phi;
    bana.skala = STARTBANA.skala;
    fart = { framat: 0, isidled: 0, upp: 0 };
    placeraKamera();
  }

  function scenHarFokus() {
    if (!tre.kamera) return false;
    if (panelScen.hidden && !document.fullscreenElement) return false;
    var etikett = document.activeElement && document.activeElement.tagName;
    return etikett !== "INPUT" && etikett !== "TEXTAREA" && etikett !== "SELECT";
  }

  document.addEventListener("keydown", function (e) {
    if (!scenHarFokus()) return;
    if (PILAR[e.key]) {
      e.preventDefault();
      tangenter[e.key] = true;
      return;
    }
    if (e.key === "r" || e.key === "R") { e.preventDefault(); aterstallVy(); }
  });

  document.addEventListener("keyup", function (e) { delete tangenter[e.key]; });
  window.addEventListener("blur", function () { tangenter = {}; });

  /* ---- musstyrning ---- */
  function kopplaMus(duk) {
    duk.style.cursor = "grab";
    duk.addEventListener("pointerdown", function (e) {
      bana.aktiv = true; bana.x = e.clientX; bana.y = e.clientY;
      duk.style.cursor = "grabbing";
      duk.setPointerCapture(e.pointerId);
    });
    duk.addEventListener("pointermove", function (e) {
      if (!bana.aktiv) return;
      // Vrider blicken kring kamerans egen position.
      bana.theta -= (e.clientX - bana.x) * 0.005;
      bana.phi += (e.clientY - bana.y) * 0.005;
      bana.x = e.clientX; bana.y = e.clientY;
      placeraKamera();
    });
    ["pointerup", "pointercancel"].forEach(function (h) {
      duk.addEventListener(h, function () { bana.aktiv = false; duk.style.cursor = "grab"; });
    });
    // Hjulet flyttar kameran fram och tillbaka längs blickriktningen.
    duk.addEventListener("wheel", function (e) {
      e.preventDefault();
      var steg = Math.max(0.3, bana.skala * 0.06) * (e.deltaY > 0 ? -1 : 1);
      flytta(steg > 0 ? 1 : -1, 0, 0, Math.abs(steg));
    }, { passive: false });
  }

  function helskarm() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (panelScen.requestFullscreen) {
      visaFlik("scen");
      panelScen.requestFullscreen();
    }
  }

  function stoppaScen() {
    if (tre.bildruta) { cancelAnimationFrame(tre.bildruta); tre.bildruta = null; }
    tre.callback = null;
  }

  function ritaBildruta() {
    if (!tre.renderare) return;
    tre.bildruta = requestAnimationFrame(ritaBildruta);
    var nu = performance.now();
    var dt = Math.min(0.05, (nu - (tre.forra || nu)) / 1000);
    tre.forra = nu;
    tre.tid += dt;
    uppdateraForflyttning(dt);
    for (var i = 0; i < tre.objekt.length; i++) {
      var o = tre.objekt[i];
      o.mesh.rotation.x += o.snurrx;
      o.mesh.rotation.y += o.snurry;
      o.mesh.rotation.z += o.snurrz;
      if (o.uppdatera) {
        try { o.uppdatera(dt); }
        catch (e) { o.uppdatera = null; }
      }
    }
    if (tre.callback) {
      try { tre.callback(tre.tid); }
      catch (e) { tre.callback = null; visaFel("Fel i varje_bildruta: " + ((e && e.message) || e)); }
    }
    tre.renderare.render(tre.scen, tre.kamera);
  }

  function startaScen() {
    var T = window.THREE;
    stoppaScen();
    var platshallare = scenruta.querySelector("p");
    if (platshallare) scenruta.removeChild(platshallare);
    tre.scen = new T.Scene();
    tre.kamera = new T.PerspectiveCamera(60, 16 / 9, 0.05, 20000);
    tre.kamera.position.set(0, 2.5, 7);
    tre.kamera.lookAt(0, 0, 0);
    if (!tre.renderare && harWebGL()) {
      try {
        tre.renderare = new T.WebGLRenderer({ antialias: true, alpha: true });
        scenruta.appendChild(tre.renderare.domElement);
        kopplaMus(tre.renderare.domElement);
      } catch (e) {
        tre.renderare = null;
      }
    }
    var riktat = new T.DirectionalLight(0xffffff, 1.1);
    riktat.position.set(4, 6, 5);
    tre.scen.add(riktat);
    tre.scen.add(new T.AmbientLight(0x8fb4ff, 0.6));
    tre.objekt = [];
    tre.tid = 0;
    tre.forra = 0;
    fart = { framat: 0, isidled: 0, upp: 0 };
    tre.blick = { x: 0, y: 0, z: 0 };            // senast angivna blickpunkt
    sikta({ x: 0, y: 5.5, z: 11 }, tre.blick);
    sparaStartlage();

    // Utan WebGL byggs scenen ändå. Objekten skapas, programmet kör
    // vidare och skriver ut sitt resultat — bara bilden uteblir.
    if (!tre.renderare) {
      if (!tre.utanWebGLSagt) {
        tre.utanWebGLSagt = true;
        skriv(SPRAK.msg.ingen_webgl + "\n", "fel");
      }
      visaUtanWebGL();
      return;
    }
    anpassaStorlek();
    ritaBildruta();
  }

  function visaUtanWebGL() {
    scenruta.textContent = "";
    var text = document.createElement("p");
    text.className = "tomt";
    text.textContent = SPRAK.msg.ingen_webgl;
    scenruta.appendChild(text);
  }

  function skapaForm(geometri, x, y, z, farg) {
    var T = window.THREE;
    var material = new T.MeshStandardMaterial({ color: new T.Color(farg || "#ffc94a"), roughness: 0.45, metalness: 0.1 });
    var mesh = new T.Mesh(geometri, material);
    mesh.position.set(x || 0, y || 0, z || 0);
    tre.scen.add(mesh);
    var handtag = {
      mesh: mesh, snurrx: 0, snurry: 0, snurrz: 0,
      move: function (a, b, c) { mesh.position.set(a, b, c); },
      rotate: function (a, b, c) { mesh.rotation.set(a, b, c); },
      spin: function (a, b, c) { handtag.snurrx = a || 0; handtag.snurry = b || 0; handtag.snurrz = c || 0; },
      scale: function (s) { mesh.scale.set(s, s, s); },
      color: function (f) { material.color.set(f); },
      height: function () { return mesh.position.y; }
    };
    tre.objekt.push(handtag);
    return handtag;
  }

  /* ---- byggstenar för sammansatta modeller ---- */
  function mtl(farg, ruff) {
    var T = window.THREE;
    return new T.MeshStandardMaterial({ color: new T.Color(farg), roughness: ruff === undefined ? 0.6 : ruff, metalness: 0.08 });
  }
  function del(foralder, geometri, farg, x, y, z, primar) {
    var m = new window.THREE.Mesh(geometri, mtl(farg));
    m.position.set(x || 0, y || 0, z || 0);
    if (primar) m.userData.primar = true;
    foralder.add(m);
    return m;
  }
  function G() { return new window.THREE.Group(); }
  function box(b, h, d) { return new window.THREE.BoxGeometry(b, h, d); }
  function klotG(r) { return new window.THREE.SphereGeometry(r, 20, 12); }
  function cylG(r, h, sidor) { return new window.THREE.CylinderGeometry(r, r, h, sidor || 16); }
  function konG(r, h, sidor) { return new window.THREE.ConeGeometry(r, h, sidor || 16); }

  function hjul(foralder, x, y, z, radie) {
    var pivot = G();
    pivot.position.set(x, y, z);
    pivot.rotation.x = Math.PI / 2;
    var m = new window.THREE.Mesh(cylG(radie, radie * 0.55, 16), mtl("#22303f", 0.9));
    pivot.add(m);
    foralder.add(pivot);
    return m;
  }

  function framat(h, dt) {
    if (!h.fart) return;
    var g = h.mesh;
    g.position.x += Math.cos(g.rotation.y) * h.fart * dt;
    g.position.z += -Math.sin(g.rotation.y) * h.fart * dt;
  }

  function gruppHandtag(grupp, x, y, z, storlek, extra) {
    grupp.position.set(x || 0, y || 0, z || 0);
    if (storlek && storlek !== 1) grupp.scale.set(storlek, storlek, storlek);
    tre.scen.add(grupp);
    var h = {
      mesh: grupp, snurrx: 0, snurry: 0, snurrz: 0, fart: 0, tid: 0,
      move: function (a, b, c) { grupp.position.set(a, b, c); },
      rotate: function (a, b, c) { grupp.rotation.set(a || 0, b || 0, c || 0); },
      spin: function (a, b, c) { h.snurrx = a || 0; h.snurry = b || 0; h.snurrz = c || 0; },
      scale: function (s) { grupp.scale.set(s, s, s); },
      color: function (f) {
        grupp.traverse(function (o) { if (o.isMesh && o.userData.primar) o.material.color.set(f); });
      }
    };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    tre.objekt.push(h);
    return h;
  }

  /* ---- fordon ---- */
  function byggBil(x, y, z, farg, storlek) {
    var g = G();
    del(g, box(2.4, 0.5, 1.2), farg, 0, 0.45, 0, true);
    del(g, box(1.2, 0.5, 1.05), farg, -0.15, 0.93, 0, true);
    del(g, box(1.1, 0.32, 1.08), "#8fb4ff", -0.15, 0.95, 0);
    del(g, box(0.14, 0.16, 0.9), "#ffe9a8", 1.2, 0.5, 0);
    var hjulen = [
      hjul(g, 0.8, 0.28, 0.62, 0.28), hjul(g, 0.8, 0.28, -0.62, 0.28),
      hjul(g, -0.8, 0.28, 0.62, 0.28), hjul(g, -0.8, 0.28, -0.62, 0.28)
    ];
    return gruppHandtag(g, x, y, z, storlek, {
      hjulen: hjulen,
      drive: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        for (var i = 0; i < hjulen.length; i++) hjulen[i].rotation.y += this.fart * dt * 3.6;
        framat(this, dt);
      }
    });
  }

  function byggLastbil(x, y, z, farg, storlek) {
    var g = G();
    del(g, box(1.5, 1.0, 1.5), farg, 1.5, 0.95, 0, true);
    del(g, box(1.3, 0.4, 1.4), "#8fb4ff", 1.55, 1.3, 0);
    del(g, box(3.2, 1.4, 1.6), "#dfe8fa", -0.7, 1.15, 0);
    del(g, box(4.8, 0.25, 1.7), "#22303f", 0.3, 0.42, 0);
    var hjulen = [
      hjul(g, 1.6, 0.34, 0.85, 0.34), hjul(g, 1.6, 0.34, -0.85, 0.34),
      hjul(g, -0.6, 0.34, 0.85, 0.34), hjul(g, -0.6, 0.34, -0.85, 0.34),
      hjul(g, -1.6, 0.34, 0.85, 0.34), hjul(g, -1.6, 0.34, -0.85, 0.34)
    ];
    return gruppHandtag(g, x, y, z, storlek, {
      drive: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        for (var i = 0; i < hjulen.length; i++) hjulen[i].rotation.y += this.fart * dt * 3.0;
        framat(this, dt);
      }
    });
  }

  function byggFlygplan(x, y, z, farg, storlek) {
    var g = G();
    var kropp = del(g, cylG(0.32, 2.6, 16), farg, 0, 0, 0, true);
    kropp.rotation.z = Math.PI / 2;
    var nos = del(g, konG(0.32, 0.7, 16), farg, 1.6, 0, 0, true);
    nos.rotation.z = -Math.PI / 2;
    del(g, box(0.8, 0.08, 3.4), farg, -0.1, 0.05, 0, true);
    del(g, box(0.5, 0.07, 1.3), farg, -1.25, 0.1, 0, true);
    del(g, box(0.5, 0.7, 0.07), farg, -1.3, 0.4, 0, true);
    del(g, box(0.7, 0.28, 0.5), "#8fb4ff", 0.75, 0.22, 0);
    var propeller = G();
    propeller.position.set(2.0, 0, 0);
    del(propeller, box(0.06, 1.5, 0.12), "#22303f", 0, 0, 0);
    del(propeller, box(0.06, 0.12, 1.5), "#22303f", 0, 0, 0);
    g.add(propeller);
    return gruppHandtag(g, x, y, z, storlek, {
      fly: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        propeller.rotation.x += (2 + this.fart) * dt * 12;
        framat(this, dt);
      }
    });
  }

  function byggRaket(x, y, z, farg, storlek) {
    var g = G();
    del(g, cylG(0.5, 3.0, 20), farg, 0, 1.5, 0, true);
    del(g, konG(0.5, 1.1, 20), farg, 0, 3.55, 0, true);
    del(g, cylG(0.52, 0.25, 20), "#8fb4ff", 0, 2.5, 0);
    for (var i = 0; i < 4; i++) {
      var v = i * Math.PI / 2;
      var fena = del(g, box(0.1, 0.9, 0.7), "#ff7d6b", Math.cos(v) * 0.45, 0.45, Math.sin(v) * 0.45);
      fena.rotation.y = -v;
    }
    var laga = del(g, konG(0.42, 1.2, 16), "#ffc94a", 0, -0.6, 0);
    laga.rotation.x = Math.PI;
    return gruppHandtag(g, x, y, z, storlek, {
      ignite: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        this.tid += dt;
        var puls = 0.75 + Math.sin(this.tid * 22) * 0.25;
        laga.scale.set(puls, 0.6 + puls * 0.8, puls);
        laga.visible = this.fart !== 0;
        if (this.fart) this.mesh.position.y += this.fart * dt;
      }
    });
  }

  /* ---- djur ---- */
  function byggHund(x, y, z, farg, storlek) {
    var g = G();
    del(g, box(1.3, 0.6, 0.6), farg, 0, 0.85, 0, true);
    del(g, box(0.55, 0.5, 0.5), farg, 0.85, 1.05, 0, true);
    del(g, box(0.3, 0.22, 0.3), "#22303f", 1.2, 0.95, 0);
    del(g, konG(0.16, 0.3, 4), farg, 0.75, 1.4, 0.18, true);
    del(g, konG(0.16, 0.3, 4), farg, 0.75, 1.4, -0.18, true);
    var svans = del(g, cylG(0.07, 0.6, 8), farg, -0.7, 1.05, 0, true);
    svans.rotation.z = -0.7;
    var ben = [];
    var platser = [[0.45, 0.25], [0.45, -0.25], [-0.45, 0.25], [-0.45, -0.25]];
    for (var i = 0; i < 4; i++) {
      var p = G();
      p.position.set(platser[i][0], 0.55, platser[i][1]);
      del(p, cylG(0.1, 0.55, 8), farg, 0, -0.28, 0, true);
      g.add(p);
      ben.push(p);
    }
    return gruppHandtag(g, x, y, z, storlek, {
      walk: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        this.tid += dt;
        var takt = this.fart ? this.tid * 7 : 0;
        for (var i = 0; i < ben.length; i++) ben[i].rotation.z = Math.sin(takt + i * Math.PI / 2) * 0.5;
        svans.rotation.x = Math.sin(this.tid * 6) * 0.6;
        framat(this, dt);
      }
    });
  }

  function byggFagel(x, y, z, farg, storlek) {
    var g = G();
    var kropp = del(g, klotG(0.4), farg, 0, 0, 0, true);
    kropp.scale.set(1.5, 0.9, 0.9);
    del(g, klotG(0.24), farg, 0.6, 0.18, 0, true);
    del(g, konG(0.1, 0.35, 8), "#ffc94a", 0.88, 0.15, 0).rotation.z = -Math.PI / 2;
    var stjart = del(g, konG(0.22, 0.6, 6), farg, -0.7, 0.05, 0, true);
    stjart.rotation.z = Math.PI / 2;
    var vingar = [];
    for (var s = 0; s < 2; s++) {
      var p = G();
      p.position.set(0, 0.15, s === 0 ? 0.25 : -0.25);
      var v = del(p, box(0.7, 0.06, 1.1), farg, 0, 0, s === 0 ? 0.55 : -0.55, true);
      g.add(p);
      vingar.push(p);
    }
    return gruppHandtag(g, x, y, z, storlek, {
      flap: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        this.tid += dt;
        var slag = Math.sin(this.tid * (4 + this.fart * 2)) * 0.6;
        vingar[0].rotation.x = -slag;
        vingar[1].rotation.x = slag;
        framat(this, dt);
      }
    });
  }

  function byggFisk(x, y, z, farg, storlek) {
    var g = G();
    var kropp = del(g, klotG(0.45), farg, 0, 0, 0, true);
    kropp.scale.set(1.6, 1.0, 0.6);
    del(g, konG(0.06, 0.2, 8), "#0e1c33", 0.6, 0.12, 0.18);
    var ryggfena = del(g, konG(0.25, 0.45, 4), farg, -0.05, 0.45, 0, true);
    var stjart = G();
    stjart.position.set(-0.7, 0, 0);
    var blad = del(stjart, konG(0.35, 0.6, 4), farg, -0.25, 0, 0, true);
    blad.rotation.z = Math.PI / 2;
    blad.scale.set(1, 1, 0.35);
    g.add(stjart);
    return gruppHandtag(g, x, y, z, storlek, {
      swim: function (fart) { this.fart = fart || 0; },
      uppdatera: function (dt) {
        this.tid += dt;
        stjart.rotation.y = Math.sin(this.tid * (5 + this.fart * 2)) * 0.7;
        framat(this, dt);
      }
    });
  }

  /* ---- byggnader och natur ---- */
  function byggHus(x, y, z, farg, storlek) {
    var g = G();
    del(g, box(3, 2, 2.6), farg, 0, 1, 0, true);
    var tak = del(g, konG(2.3, 1.3, 4), "#ff7d6b", 0, 2.65, 0);
    tak.rotation.y = Math.PI / 4;
    del(g, box(0.5, 0.7, 0.5), "#8a6a4a", 1.0, 2.9, -0.7);
    del(g, box(0.06, 0.9, 0.6), "#8a6a4a", 1.52, 0.45, 0.6);
    del(g, box(0.06, 0.6, 0.6), "#ffe9a8", 1.52, 1.3, -0.6);
    del(g, box(0.6, 0.6, 0.06), "#ffe9a8", -0.6, 1.3, 1.32);
    del(g, box(0.6, 0.6, 0.06), "#ffe9a8", 0.6, 1.3, 1.32);
    return gruppHandtag(g, x, y, z, storlek, {});
  }

  function byggSkyskrapa(x, y, z, farg, storlek) {
    var g = G();
    var hojd = 10;
    del(g, box(2.4, hojd, 2.4), farg, 0, hojd / 2, 0, true);
    del(g, box(2.0, 0.6, 2.0), farg, 0, hojd + 0.3, 0, true);
    del(g, cylG(0.07, 2.2, 8), "#8fb4ff", 0, hojd + 1.6, 0);
    for (var v = 1; v < hojd - 0.5; v += 1.3) {
      del(g, box(2.44, 0.5, 2.0), "#8fb4ff", 0, v, 0);
      del(g, box(2.0, 0.5, 2.44), "#8fb4ff", 0, v, 0);
    }

  /* En skärm med ram och fot — diagram mappas på framsidan. */
  function byggSkarm(x, y, z, bredd, hojd, dataurl, stativ) {
    var T = window.THREE;

    list.position.y = -(hj / 2 + kant * 1.2) + kant * 0.25;

    });
    var skarm = new T.Mesh(new T.PlaneGeometry(b, hj), skarmMtl);
    skarm.position.z = djup / 2 + 0.03;
    grupp.add(skarm);

    // Strömlampa
    var lampa = new T.Mesh(klotG(kant * 0.3),
      new T.MeshBasicMaterial({ color: new T.Color("#2f9e6a") }));
    lampa.position.set(b / 2 - kant, -(hj / 2) - kant * 1.3, djup / 2);

    if (stativ !== false) {
      var hals = new T.Mesh(box(b * 0.13, hj * 0.3, djup * 0.55),

      fot.position.y = -(hj / 2 + kant * 1.2) - hj * 0.3;

      new T.TextureLoader().load(url, function (textur) {
        if ("colorSpace" in textur && T.SRGBColorSpace) textur.colorSpace = T.SRGBColorSpace;
        else if (T.sRGBEncoding) textur.encoding = T.sRGBEncoding;
        if (T.LinearFilter) { textur.minFilter = T.LinearFilter; textur.magFilter = T.LinearFilter; }
        if ("anisotropy" in textur && tre.renderare.capabilities) {
          textur.anisotropy = tre.renderare.capabilities.getMaxAnisotropy();
        }
        skarmMtl.map = textur;
        skarmMtl.needsUpdate = true;
      });
    }
    if (dataurl) sattBild(dataurl);

    var h = {
      mesh: grupp, snurrx: 0, snurry: 0, snurrz: 0,
      move: function (a, b2, c) { grupp.position.set(a, b2, c); },
      rotate: function (a, b2, c) { grupp.rotation.set(a || 0, b2 || 0, c || 0); },
      spin: function (a, b2, c) { h.snurrx = a || 0; h.snurry = b2 || 0; h.snurrz = c || 0; },
      scale: function (s) { grupp.scale.set(s, s, s); },
      color: function (f) { holje.material.color.set(f); },
      set_image: sattBild,
      face_camera: function () { h.foljer = true; },
      uppdatera: function () {
        if (h.foljer) {
          grupp.lookAt(tre.kamera.position.x, grupp.position.y, tre.kamera.position.z);
        }
      }
    };
    tre.objekt.push(h);

  /* Ritar en sammanhängande linje genom en lista av [x, z]-punkter. */
  function byggKontur(punkter, farg, tjocklek, y, sluten) {
    var T = window.THREE;
    var grupp = G();
    var mat = new T.MeshBasicMaterial({ color: new T.Color(farg || "#8fb4ff") });
    var t = tjocklek || 0.08;
    var hojd = y || 0.06;
    var lista = punkter.map ? punkter : Array.prototype.slice.call(punkter);
    var antal = lista.length;
    var slut = sluten === false ? antal - 1 : antal;
    for (var i = 0; i < slut; i++) {
      var a = lista[i], b = lista[(i + 1) % antal];
      var ax = a[0], az = a[1], bx = b[0], bz = b[1];
      var dx = bx - ax, dz = bz - az;
      var langd = Math.sqrt(dx * dx + dz * dz);
      if (langd < 1e-6) continue;
      var segment = new T.Mesh(box(langd, t * 0.6, t), mat);
      segment.position.set((ax + bx) / 2, hojd, (az + bz) / 2);
      segment.rotation.y = -Math.atan2(dz, dx);
      grupp.add(segment);
      var knut = new T.Mesh(cylG(t * 0.5, t * 0.6, 8), mat);
      knut.position.set(bx, hojd, bz);
      grupp.add(knut);
    }
    tre.scen.add(grupp);
    var h = {
      mesh: grupp, snurrx: 0, snurry: 0, snurrz: 0,
      move: function (p, q, r) { grupp.position.set(p, q, r); },
      rotate: function (p, q, r) { grupp.rotation.set(p || 0, q || 0, r || 0); },
      spin: function () {}, scale: function (s) { grupp.scale.set(s, s, s); },
      color: function (f) { mat.color.set(f); }
    };
    tre.objekt.push(h);
    return h;
  }
